<style>
  .adm { padding-block: 28px 80px; }
  .adm h1 { font-family: "Baloo 2", sans-serif; font-size: 34px; margin: 0 0 4px; }
  .adm h2 { font-family: "Baloo 2", sans-serif; font-size: 24px; margin: 0 0 4px; }
  .adm .sub { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
  .adm section.box { padding: 20px 22px; margin-top: 22px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
  .filters button, .filters select, .filters input { font: inherit; font-size: 15px; padding: 7px 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); color: var(--ink); }
  .filters button.on { background: var(--yellow); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 18px; }
  .tile { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; }
  .tile b { display: block; font-family: "Baloo 2", sans-serif; font-size: 28px; line-height: 1.1; }
  .tile span { color: var(--muted); font-size: 13px; font-weight: 700; }
  .tile i { display: block; font-style: normal; font-size: 12px; margin-top: 4px; color: var(--muted); }
  .tile i.up { color: #147344; } .tile i.down { color: #b3372e; }
  .fun { display: grid; gap: 8px; margin-top: 10px; }
  .fun .row { display: grid; grid-template-columns: minmax(150px, 230px) 1fr 120px; gap: 12px; align-items: center; font-size: 15px; }
  .fun .fbar { height: 26px; background: #efe9dc; border-radius: 8px; overflow: hidden; }
  .fun .fbar > div { height: 100%; background: var(--yellow); border-right: 2px solid var(--ink); min-width: 2px; }
  .fun .row.worst .fbar > div { background: var(--red); }
  .fun .row .num { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .fun .row .num small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
  .alert { margin-top: 12px; background: var(--red-soft); border: 2px solid var(--red); border-radius: 12px; padding: 10px 14px; font-weight: 700; }
  .ok-note { margin-top: 12px; background: #dcf2e5; border: 2px solid #147344; border-radius: 12px; padding: 10px 14px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
  .tbl-wrap { overflow-x: auto; margin-top: 10px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th, table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.t th:first-child, table.t td:first-child { text-align: left; white-space: normal; }
  table.t th { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); user-select: none; }
  table.t tr.bad td { background: var(--red-soft); } table.t tr.good td { background: #dcf2e5; }
  .ins li { margin: 6px 0; }
  .chart svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .spend-form { display: grid; gap: 10px; margin-top: 10px; }
  .spend-form textarea { width: 100%; min-height: 90px; font: 13px/1.4 "JetBrains Mono", monospace; border: 2px solid var(--ink); border-radius: 10px; padding: 8px; }
  .spend-form .inline { display: flex; flex-wrap: wrap; gap: 8px; }
  .spend-form input { font: inherit; font-size: 14px; padding: 7px 10px; border: 2px solid var(--ink); border-radius: 10px; }
  .msg { font-weight: 700; margin-top: 6px; }
  .empty { color: var(--muted); font-style: italic; }
  .denied { text-align: center; padding: 80px 20px; }
  @media (max-width: 760px) { .two { grid-template-columns: minmax(0, 1fr); } .fun .row { grid-template-columns: 1fr 90px; } .fun .row .fbar { grid-column: 1 / -1; order: 3; } }
</style>

<body>
<div id="site-header" data-page="admin"></div>
<main class="container adm" id="adm">
  <p class="empty">Wczytuję statystyki…</p>
</main>
<script src="app.js?v=578ed517fa"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const root = $("#adm");
  const fmt = (n, d = 0) => n == null ? "–" : Number(n).toLocaleString("pl-PL", { minimumFractionDigits: d, maximumFractionDigits: d });
  const zl = n => n == null ? "–" : fmt(n, n % 1 ? 2 : 0) + " zł";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const day = t => new Date(t).toLocaleDateString("sv-SE", { timeZone: "Europe/Warsaw" });
  const today = day(Date.now());
  const minus = n => day(Date.now() - n * 86400000);
  const F = { range: "7", from: minus(6), to: today, source: "", device: "" };
  let data = null, sortKey = "sessions", sortDir = -1;

  function rangeSet(r) {
    F.range = r;
    if (r === "1") { F.from = today; F.to = today; }
    else if (r === "7") { F.from = minus(6); F.to = today; }
    else if (r === "30") { F.from = minus(29); F.to = today; }
    else if (r === "all") { F.from = (data && data.firstDay) || minus(365); F.to = today; }
    load();
  }
  async function load() {
    const qs = new URLSearchParams({ from: F.from, to: F.to, source: F.source, device: F.device });
    try { data = await M8.api("/api/admin/stats?" + qs); render(); }
    catch (e) { root.innerHTML = `<div class="denied"><h1>Brak dostępu</h1><p>Zaloguj się na konto admina.</p><a class="btn btn-yellow" href="logowanie.html">Zaloguj się</a></div>`; }
  }
  function change(cur, prev, inverse) {
    if (prev == null || cur == null) return "";
    if (!prev) return cur ? `<i class="${inverse ? "down" : "up"}">nowe (poprz. 0)</i>` : `<i>bez zmian</i>`;
    const d = Math.round((cur - prev) / prev * 100);
    const good = inverse ? d < 0 : d > 0;
    return `<i class="${d === 0 ? "" : good ? "up" : "down"}">${d > 0 ? "+" : ""}${d}% vs poprzedni okres</i>`;
  }
  function tile(label, v, prev, txt, inverse) { return `<div class="tile"><span>${label}</span><b>${txt}</b>${change(v, prev, inverse)}</div>`; }
  function funnelHtml(f, big) {
    if (!f.steps.length || !f.steps[0].n) return `<p class="empty">Brak wejść w tym okresie.</p>`;
    const max = f.steps[0].n;
    const rows = f.steps.map((s, i) => `<div class="row ${f.worst && f.worst.i === i ? "worst" : ""}">
      <div>${esc(s.label)}</div><div class="fbar"><div style="width:${Math.max(0.5, s.n / max * 100)}%"></div></div>
      <div class="num">${fmt(s.n)}<small>${i ? (f.steps[i - 1].n ? fmt(s.ofPrev, 1) + "% z poprz. · " : "") : ""}${fmt(s.ofStart, 1)}% wszystkich</small></div></div>`).join("");
    const w = f.worst && big ? `<div class="alert">Tu odpada najwięcej: ${Math.round(f.worst.drop)}% osób z kroku „${esc(f.worst.from)}” nie przechodzi do „${esc(f.worst.to)}”.</div>` : "";
    return `<div class="fun">${rows}</div>${w}`;
  }
  const COLS = [["source", "Źródło / reklama"], ["sessions", "Wejścia"], ["lessonPct", "Lekcja %"], ["pricingPct", "Cennik %"], ["checkout", "Płatności"],
    ["purchase", "Zakupy"], ["conv", "Konw. %"], ["spend", "Wydatki"], ["cpa", "Koszt zakupu"], ["roas", "ROAS"]];
  function adsHtml() {
    const rows = data.ads.slice().sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      if (sortKey === "source") return String(x).localeCompare(String(y)) * sortDir;
      return ((x == null ? -1 : x) - (y == null ? -1 : y)) * sortDir;
    });
    if (!rows.length) return `<p class="empty">Brak danych w tym okresie.</p>`;
    return `<div class="tbl-wrap"><table class="t" id="ads-t"><thead><tr>${COLS.map(([k, l]) => `<th data-k="${k}">${l}${sortKey === k ? (sortDir < 0 ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead><tbody>
      ${rows.map(a => `<tr class="${a.cpa != null && a.cpa > 199 ? "bad" : a.cpa != null && a.cpa < 100 ? "good" : a.spend >= 80 && !a.purchase ? "bad" : ""}">
        <td><b>${esc(a.source)}</b>${a.campaign ? " · " + esc(a.campaign) : ""}${a.content ? "<br><small>" + esc(a.content) + "</small>" : ""}</td>
        <td>${fmt(a.sessions)}</td><td>${fmt(a.lessonPct, 1)}%</td><td>${fmt(a.pricingPct, 1)}%</td><td>${fmt(a.checkout)}</td><td>${fmt(a.purchase)}</td>
        <td>${fmt(a.conv, 1)}%</td><td>${a.spend ? zl(a.spend) : "–"}</td><td>${zl(a.cpa)}</td><td>${a.roas == null ? "–" : fmt(a.roas, 2)}</td></tr>`).join("")}
      </tbody></table></div>`;
  }
  function lessonHtml() {
    const L = data.lesson;
    const A = L.ad || {};
    // wejścia z reklamy „Film zadanie” zaczynają od zadania z reklamy i są liczone osobno
    const adLine = A.shown ? `<p class="sub">Z reklamy „Film zadanie” (na start zadanie z reklamy): <b>${A.shown}</b> · odpowiedziało <b>${A.answered}</b> (dobrze ${A.good})
      · poszło dalej <b>${A.toLesson + A.fromStart + A.viaMenu}</b> (do lekcji z tą metodą: ${A.toLesson}, od początku: ${A.fromStart}, przez spis: ${A.viaMenu})
      · przeszło 2 lekcje <b>${A.lesson2}</b></p>` : "";
    if (!L.starts) return adLine || `<p class="empty">Nikt jeszcze nie zaczął darmowej lekcji w tym okresie.</p>`;
    const names = k => k === 0 ? "Rozgrzewka" : k === 11 ? "Podsumowanie" : "Lekcja " + k;
    const ks = Object.keys(L.reached).map(Number).sort((a, b) => a - b);
    const items = ks.map(k => [names(k), L.reached[k]]).concat([["Ćwiczenia: start", L.practiceStart], ["Ćwiczenia: koniec", L.practiceDone], ["Test: start", L.testStart], ["Test: koniec", L.testDone], ["Klik „Zobacz plany i ceny”", L.ctaClicks]]);
    const max = Math.max(...items.map(i => i[1]), 1), W = 640, bh = 22, gap = 6, H = items.length * (bh + gap);
    const bars = items.map(([n, v], i) => `<g transform="translate(0 ${i * (bh + gap)})"><text x="0" y="${bh - 6}" font-size="13" fill="#16181d">${esc(n)}</text>
      <rect x="190" y="0" width="${Math.max(2, v / max * (W - 260))}" height="${bh}" rx="5" fill="${i >= ks.length ? "#3a7cf0" : "#ffc233"}" stroke="#16181d" stroke-width="1.5"/>
      <text x="${196 + v / max * (W - 260)}" y="${bh - 6}" font-size="13" font-weight="700" fill="#16181d">${v} (${Math.round(v / L.starts * 100)}%)</text></g>`).join("");
    return adLine + `<p class="sub">Rozpoczęło od rozgrzewki: <b>${L.starts}</b> · średni wynik testu: <b>${L.avgScore == null ? "–" : fmt(L.avgScore, 1) + " / " + L.testMax}</b></p>
      <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Do którego kroku dochodzą osoby w darmowej lekcji">${bars}</svg></div>`;
  }
  function dailyHtml() {
    const D = data.daily; if (!D.length) return "";
    const W = 720, H = 220, pad = 30, n = D.length, bw = (W - pad * 2) / n;
    const mv = Math.max(1, ...D.map(d => d.visitors)), ms = Math.max(1, ...D.map(d => d.spend)), mp = Math.max(1, ...D.map(d => d.purchases));
    const x = i => pad + i * bw + bw / 2, y = (v, m) => H - pad - v / m * (H - pad * 2);
    const bars = D.map((d, i) => `<rect x="${pad + i * bw + bw * .15}" y="${y(d.visitors, mv)}" width="${bw * .7}" height="${H - pad - y(d.visitors, mv)}" fill="#ffc233"><title>${d.day}: ${d.visitors} odwiedzających</title></rect>`).join("");
    const line = D.map((d, i) => `${i ? "L" : "M"}${x(i)},${y(d.spend, ms)}`).join(" ");
    const dots = D.map((d, i) => d.purchases ? `<circle cx="${x(i)}" cy="${y(d.purchases, mp) }" r="${4 + d.purchases / mp * 4}" fill="#147344"><title>${d.day}: ${d.purchases} zakupów</title></circle>` : "").join("");
    const lbl = D.map((d, i) => (n <= 14 || i % Math.ceil(n / 10) === 0) ? `<text x="${x(i)}" y="${H - 10}" font-size="11" text-anchor="middle" fill="#5e5a51">${d.day.slice(5)}</text>` : "").join("");
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres dzienny">${bars}<path d="${line}" fill="none" stroke="#e5483e" stroke-width="2.5"/>${dots}${lbl}</svg></div>
      <div class="legend"><span><i style="background:#ffc233"></i>odwiedzający (max ${mv})</span><span><i style="background:#e5483e"></i>wydatki (max ${zl(ms)})</span><span><i style="background:#147344"></i>zakupy</span></div>`;
  }
  function pagesHtml() {
    const P = data.pages, li = arr => arr.length ? `<div class="tbl-wrap"><table class="t">${arr.map(r => `<tr><td>${esc(r.path)}</td><td>${fmt(r.n)}</td></tr>`).join("")}</table></div>` : `<p class="empty">Brak danych.</p>`;
    const sc = Object.entries(P.scroll).map(([p, v]) => `<tr><td>${p === "/" ? "Strona główna" : "Cennik"}</td><td>${fmt(v.views)}</td><td>${fmt(v.s50, 1)}%</td><td>${fmt(v.s90, 1)}%</td></tr>`).join("");
    const dv = Object.entries(P.devices).filter(([, v]) => v.sessions).map(([d, v]) => `<tr><td>${{ mobile: "Telefon", desktop: "Komputer", tablet: "Tablet" }[d]}</td><td>${fmt(v.sessions)}</td><td>${fmt(v.pricing, 1)}%</td><td>${fmt(v.purchases)}</td><td>${fmt(v.conv, 1)}%</td></tr>`).join("");
    return `<div class="two"><div><h3>Najczęściej odwiedzane</h3>${li(P.top)}</div><div><h3>Strony wyjścia (ostatnia strona wizyty)</h3>${li(P.exits)}</div></div>
      <div class="two" style="margin-top:14px"><div><h3>Przewinięcie strony</h3><div class="tbl-wrap"><table class="t"><tr><th>Strona</th><th>Wejścia</th><th>50%</th><th>90%</th></tr>${sc}</table></div></div>
      <div><h3>Telefon czy komputer</h3><div class="tbl-wrap"><table class="t"><tr><th>Urządzenie</th><th>Wejścia</th><th>Cennik %</th><th>Zakupy</th><th>Konw. %</th></tr>${dv || `<tr><td colspan="5" class="empty">Brak danych.</td></tr>`}</table></div></div></div>`;
  }
  function payHtml() {
    const P = data.payments;
    return `<div class="tiles">${[["Rozpoczęte", P.started], ["Opłacone", P.paid], ["Porzucone (wygasłe)", P.abandoned], ["Zwroty", P.refunds],
        ["Plan 199 zł", P.exam], ["Plan 49 zł/mies.", P.monthly]].map(([l, v]) => `<div class="tile"><span>${l}</span><b>${fmt(v)}</b></div>`).join("")}
      <div class="tile"><span>Wpłaty brutto</span><b>${zl(P.gross)}</b><i>zwroty: ${zl(P.refundPln)}</i></div></div>
      <h3 style="margin-top:16px">Ostatnie zakupy</h3>
      ${P.recent.length ? `<div class="tbl-wrap"><table class="t"><tr><th>Data</th><th>Plan</th><th>Kwota</th><th>Źródło</th></tr>${P.recent.map(r => `<tr><td>${new Date(r.at).toLocaleString("pl-PL", { timeZone: "Europe/Warsaw" })}</td><td>${r.plan === "monthly" ? "49 zł/mies." : "do egzaminu"}</td><td>${zl(r.kwota)}</td><td>${esc(r.source)}${r.content ? " · " + esc(r.content) : ""}</td></tr>`).join("")}</table></div>` : `<p class="empty">Brak zakupów w tym okresie.</p>`}`;
  }
  function spendHtml() {
    return `<p class="sub">Koszty reklam łączą się z wejściami po <b>nazwie reklamy</b> (parametr utm_content). Eksport z Menedżera reklam: Raporty → podział według dnia i reklamy → kolumny: dzień, nazwa reklamy, wydana kwota, wyświetlenia, kliknięcia linku → Eksportuj (CSV).</p>
      <div class="spend-form">
        <label><b>Wklej zawartość pliku CSV</b> albo wybierz plik: <input type="file" id="csv-file" accept=".csv,text/csv"></label>
        <textarea id="csv" placeholder="Dzień,Nazwa reklamy,Wydana kwota (PLN),Wyświetlenia,Kliknięcia linku&#10;2026-10-05,Film zadanie,23.40,2100,31"></textarea>
        <div class="inline"><button class="btn btn-small btn-yellow" id="csv-save" type="button">Importuj CSV</button></div>
        <b>…albo dopisz ręcznie jeden dzień:</b>
        <div class="inline"><input type="date" id="m-day" value="${today}"><input id="m-ad" placeholder="Nazwa reklamy (jak utm_content)"><input id="m-spend" placeholder="Wydane zł" inputmode="decimal" size="9"><input id="m-clk" placeholder="Kliknięcia" inputmode="numeric" size="9"><button class="btn btn-small" id="m-save" type="button">Zapisz</button></div>
        <div class="msg" id="spend-msg"></div>
      </div>
      <details style="margin-top:12px"><summary>Zapisane koszty (ostatnie 500)</summary><div id="spend-list" class="tbl-wrap"><p class="empty">…</p></div></details>`;
  }
  async function spendList() {
    const box = $("#spend-list"); if (!box) return;
    try {
      const r = await M8.api("/api/admin/spend");
      box.innerHTML = r.rows.length ? `<table class="t"><tr><th>Dzień</th><th>Reklama</th><th>Wydane</th><th>Wyśw.</th><th>Klik.</th><th></th></tr>${r.rows.map(x => `<tr><td>${x.day}</td><td>${esc(x.content)}</td><td>${zl(x.spend_pln)}</td><td>${fmt(x.impressions)}</td><td>${fmt(x.clicks)}</td><td><button class="btn btn-small" data-del='${esc(JSON.stringify({ day: x.day, content: x.content, source: x.source }))}' type="button">Usuń</button></td></tr>`).join("")}</table>` : `<p class="empty">Brak zapisanych kosztów.</p>`;
    } catch (e) { box.textContent = e.message; }
  }
  function render() {
    const t = data.tiles, p = data.prev;
    root.innerHTML = `
      <h1>Panel admina</h1>
      <p class="sub">Statystyki bez cookies: lejek, reklamy i płatności. Okres: <b>${data.from}</b> – <b>${data.to}</b> (porównanie: ${data.prevFrom} – ${data.prevTo}). Twoje wizyty i wizyty kupujących się nie liczą.</p>
      <div class="filters">
        ${[["1", "Dziś"], ["7", "7 dni"], ["30", "30 dni"], ["all", "Od startu"]].map(([k, l]) => `<button type="button" data-range="${k}" class="${F.range === k ? "on" : ""}">${l}</button>`).join("")}
        <input type="date" id="f-from" value="${F.from}"> – <input type="date" id="f-to" value="${F.to}">
        <select id="f-src"><option value="">Wszystkie źródła</option>${data.sources.map(s => `<option ${F.source === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
        <select id="f-dev"><option value="">Wszystkie urządzenia</option>${[["mobile", "Telefon"], ["desktop", "Komputer"], ["tablet", "Tablet"]].map(([k, l]) => `<option value="${k}" ${F.device === k ? "selected" : ""}>${l}</option>`).join("")}</select>
      </div>
      <div class="tiles">
        ${tile("Odwiedzający", t.visitors, p.visitors, fmt(t.visitors))}
        ${tile("Darmowe lekcje", t.lessons, p.lessons, fmt(t.lessons))}
        ${tile("Wejścia na cennik", t.pricing, p.pricing, fmt(t.pricing))}
        ${tile("Rozpoczęte płatności", t.checkouts, p.checkouts, fmt(t.checkouts))}
        ${tile("Zakupy", t.purchases, p.purchases, fmt(t.purchases))}
        ${tile("Przychód (po zwrotach)", t.revenue, p.revenue, zl(t.revenue))}
        ${tile("Wydatki na reklamy", t.spend, p.spend, zl(t.spend), true)}
        ${tile("Koszt zakupu (CPA)", t.cpa, p.cpa, zl(t.cpa), true)}
        ${tile("ROAS", t.roas, p.roas, t.roas == null ? "–" : fmt(t.roas, 2))}
      </div>
      <section class="box"><h2>Wnioski</h2><ul class="ins">${data.insights.map(i => `<li>${esc(i)}</li>`).join("")}</ul></section>
      <section class="box"><h2>Lejek sprzedaży</h2><p class="sub">Liczba wizyt, które doszły do danego kroku (w dowolnej kolejności).</p>${funnelHtml(data.funnel, true)}
        <div class="two" style="margin-top:18px"><div><h3>Wejście na stronę główną</h3>${funnelHtml(data.entryHome)}</div><div><h3>Wejście prosto na darmową lekcję</h3>${funnelHtml(data.entryLesson)}</div></div></section>
      <section class="box"><h2>Reklamy i źródła</h2><p class="sub">Kliknij nagłówek, żeby posortować. Czerwone: koszt zakupu powyżej 199 zł albo 0 zakupów przy co najmniej 80 zł. Zielone: poniżej 100 zł.</p>${adsHtml()}</section>
      <section class="box"><h2>Darmowa lekcja krok po kroku</h2>${lessonHtml()}</section>
      <section class="box"><h2>Płatności</h2>${payHtml()}</section>
      <section class="box"><h2>Dzień po dniu</h2>${dailyHtml()}</section>
      <section class="box"><h2>Strony i urządzenia</h2>${pagesHtml()}</section>
      <section class="box"><h2>Koszty reklam</h2>${spendHtml()}</section>`;
    root.querySelectorAll("[data-range]").forEach(b => b.onclick = () => rangeSet(b.dataset.range));
    $("#f-from").onchange = e => { F.from = e.target.value; F.range = ""; load(); };
    $("#f-to").onchange = e => { F.to = e.target.value; F.range = ""; load(); };
    $("#f-src").onchange = e => { F.source = e.target.value; load(); };
    $("#f-dev").onchange = e => { F.device = e.target.value; load(); };
    const at = $("#ads-t");
    if (at) at.querySelectorAll("th").forEach(th => th.onclick = () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : -1; sortKey = k; render(); });
    const msg = $("#spend-msg");
    const post = async body => { msg.textContent = "Zapisuję…"; try { const r = await M8.api("/api/admin/spend", { method: "POST", body }); msg.textContent = `Zapisano wierszy: ${r.saved}.`; load(); } catch (e) { msg.textContent = e.message; } };
    $("#csv-file").onchange = e => { const f = e.target.files[0]; if (f) f.text().then(t => { $("#csv").value = t; }); };
    $("#csv-save").onclick = () => post({ csv: $("#csv").value });
    $("#m-save").onclick = () => post({ rows: [{ day: $("#m-day").value, content: $("#m-ad").value.trim(), spend: $("#m-spend").value, clicks: $("#m-clk").value }] });
    root.querySelector("details").addEventListener("toggle", spendList, { once: true });
  }
  root.addEventListener("click", async e => {
    const b = e.target.closest("[data-del]"); if (!b || !confirm("Usunąć ten wiersz kosztów?")) return;
    await M8.api("/api/admin/spend", { method: "DELETE", body: JSON.parse(b.dataset.del) }); load();
  });
  load();
})();
</script>
</body>
</html>

      <div class="qz-opts">${q.order.map((k, j) => {
        const cls = !answered ? '' : k === ans ? 'ok' : k === o.picked ? 'no' : 'dim';
        return `<button class="qz-o ${cls}" data-act="quiz-pick" data-k="${k}" ${answered ? 'disabled' : ''}><span class="qz-l">${L[j]}</span><span>${mdi(q.options[k])}</span></button>`;
      }).join('')}</div>
      ${answered ? `<div class="qz-why"><p><b>${o.picked === ans ? 'Dobrze.' : 'Niestety nie.'}</b> ${mdi(q.why || '')}</p>${expl}${wrong && n && Number.isInteger(q.sec) && arr(n.sections)[q.sec] ? `<button class="btn ghost sm" style="margin-top:6px" data-act="quiz-goto" data-id="${esc(n.id)}" data-sec="${q.sec}">Wróć do części: ${esc(n.sections[q.sec].heading || 'Notatki')}</button>` : ''}</div>${more}

/* ---------- termin: podgląd i edycja ---------- */
function ovDay(o) {

function draftFrom(n) {

function secRemap(d) {
  const m = new Map();
  arr(d.sections).filter(x => String(x.heading || '').trim() || String(x.body || '').trim()).forEach((x, j) => { if (Number.isInteger(x._o)) m.set(x._o, j); });

    highYield: lines(d.highYield), practice: lines(d.practice), clinical: [], mnemonics: lines(d.mnemonics),
    sections: arr(d.sections).map(x => ({heading: String(x.heading || '').trim(), body: String(x.body || '').trim()})).filter(x => x.heading || x.body),
    terms: arr(d.terms).map(x => ({...x, term: String(x.term || '').trim(), def: String(x.def || '').trim()})).filter(x => x.term),
    flashcards: fixSec(arr(d.flashcards).map(c => ({...c, id: c.id || newCardId(), q: String(c.q || '').trim(), a: String(c.a || '').trim()})).filter(c => c.q && c.a)),

      // odpowiedzi i ich wyjaśnienia filtrujemy parami, żeby indeksy się nie rozjechały

      const pairs = arr(q.options).map((o, i) => ({o: String(o || '').trim(), e: String(ex[i] || '').trim(), i})).filter(x => x.o);
      const answer = pairs.findIndex(x => x.i === (Number(q.answer) || 0));

function incompleteItems(d) {
  const out = [], t = v => String(v || '').trim();
  d.flashcards.forEach((c, i) => { if ((t(c.q) || t(c.a)) && !(t(c.q) && t(c.a))) out.push({tab: 'cards', msg: `fiszka ${i + 1} (brak ${t(c.q) ? 'odpowiedzi' : 'pytania'})`}); });
  d.quiz.forEach((q, i) => {
    const opts = arr(q.options).map(t), filled = opts.filter(Boolean).length;
    if (!t(q.q) && !filled) return;
    const why = !t(q.q) ? 'brak treści pytania' : filled < 2 ? 'za mało odpowiedzi' : !opts[Number(q.answer) || 0] ? 'zaznaczona poprawna odpowiedź jest pusta' : '';
    if (why) out.push({tab: 'quiz', msg: `pytanie ${i + 1} (${why})`});
  });
  d.terms.forEach((x, i) => { if (!t(x.term) && t(x.def)) out.push({tab: 'content', msg: `pojęcie ${i + 1} (brak nazwy)`}); });

}
async function saveEditor(force) {
  const o = S.ov;

  const bad = incompleteItems(o.draft);
  if (bad.length) { o.confirmClose = false; o.err = 'Uzupełnij albo usuń: ' + bad.map(b => b.msg).join(', ') + '.'; o.tab = bad[0].tab; renderOv(); return; }

  o.confirmClose = false;
  if (!c.title) { o.err = 'Podaj tytuł wykładu.'; o.tab = 'content'; renderOv(); return; }
  const cur = o.id ? noteById(o.id) : null;
  if (o.id && !cur) { o.err = 'Ten wykład został w międzyczasie usunięty.'; renderOv(); return; }
  if (cur && !force && contentSig(cur) !== o.baseSig) { o.conflict = true; renderOv(); return; }
  o.saving = true; o.err = null; o.conflict = false; renderOv();
  try {
    let id = o.id;
    if (cur) {
      const {id: _id, ...rest} = cur, fixSec = secRemap(o.draft);
      if (!cur.own && !cur.hasBackup) { await S.db.doc('noteBackups/' + o.id).set({...rest, savedAt: nowIso()}); rest.hasBackup = true; }
      for (const k of ['grammar', 'worked', 'examQuestions']) if (Array.isArray(rest[k])) rest[k] = fixSec(rest[k]);
      await S.db.doc('notes/' + o.id).set({...rest, ...c, editedAt: nowIso()});
    } else {
      const ref = S.db.collection('notes').doc();
      id = ref.id;
      const data = {...c, subjectId: o.sid, nr: nextNr(o.sid), own: true, source: 'własna notatka', addedBy: 'ja', addedAt: nowIso()};
      await ref.set(data);
      if (!noteById(id)) S.notes = S.notes.concat([{...data, id}]);
    }
    clearLocalDraft(o);
    closeOv();
    toast(cur ? 'Zapisano zmiany.' : 'Zapisano własną notatkę.');
    if (!cur) openNote(id);
  } catch (e) { o.saving = false; o.err = dbErr(e); renderOv(); }
}

const loadedLibs = {};
function loadScript(src) {
  return loadedLibs[src] || (loadedLibs[src] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = () => res();
    s.onerror = () => { delete loadedLibs[src]; rej(new Error('Nie udało się wczytać czytnika plików. Sprawdź połączenie i spróbuj ponownie.')); };
    document.head.appendChild(s);
  }));
}
const parseXml = x => new DOMParser().parseFromString(x, 'application/xml');
function xmlParas(doc, pTag, tTag) {
  const out = [];
  for (const p of doc.getElementsByTagName(pTag)) {
    let t = '';
    for (const n of p.getElementsByTagName(tTag)) t += n.textContent;
    t = t.replace(/\s+/g, ' ').trim();
    if (t) out.push(t);
  }
  return out;
}
const xkids = (el, name) => Array.from(el.children || []).filter(c => c.nodeName === name);
const xfirst = (el, name) => el.getElementsByTagName(name)[0] || null;
const xclean = v => String(v || '').replace(/\s+/g, ' ').trim();
const paraText = pEl => xclean(Array.from(pEl.getElementsByTagName('a:t')).map(t => t.textContent).join(''));
function tableMd(tbl) {
  const rows = xkids(tbl, 'a:tr').map(tr => xkids(tr, 'a:tc').map(tc => Array.from(tc.getElementsByTagName('a:p')).map(paraText).filter(Boolean).join(' ').replace(/\|/g, '/')));
  if (!rows.length) return '';
  const w = Math.max(...rows.map(r => r.length));
  const line = r => '| ' + Array.from({length: w}, (_, i) => r[i] || '').join(' | ') + ' |';
  return [line(rows[0]), '|' + ' --- |'.repeat(w), ...rows.slice(1).map(line)].join('\n');
}
function chartText(xml) {
  const d = parseXml(xml), t = xfirst(d, 'c:title');
  const title = t ? xclean(Array.from(t.getElementsByTagName('a:t')).map(x => x.textContent).join(' ')) : '';
  const out = [];
  for (const ser of Array.from(d.getElementsByTagName('c:ser'))) {
    const tx = xfirst(ser, 'c:tx');
    const name = tx ? xclean(Array.from(tx.getElementsByTagName('c:v')).map(v => v.textContent).join(' ')) : '';
    const pts = el => { const m = {}; if (el) for (const pt of Array.from(el.getElementsByTagName('c:pt'))) { const v = xfirst(pt, 'c:v'); if (v) m[pt.getAttribute('idx')] = v.textContent; } return m; };
    const cats = pts(xfirst(ser, 'c:cat')), vals = pts(xfirst(ser, 'c:val') || xfirst(ser, 'c:yVal'));
    const pairs = Object.keys(vals).sort((x, y) => x - y).map(i => `${cats[i] != null ? cats[i] : '#' + (Number(i) + 1)} = ${vals[i]}`);
    if (pairs.length) out.push(`${name || 'seria'}: ${pairs.join('; ')}`);
  }
  return out.length ? `[Wykres${title ? ': ' + title : ''}] ` + out.join(' | ') : '';

async function pptxText(file, say) {
  await loadScript(LIB.jszip);
  const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
  const read = path => zip.file(path) ? zip.file(path).async('string') : Promise.resolve(null);
  const resolve = (base, target) => {
    const parts = base.split('/');
    parts.pop();
    for (const seg of String(target).split('/')) { if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg); }
    return parts.join('/');
  };
  let order = [];
  try {
    const pres = parseXml(await read('ppt/presentation.xml'));
    const rels = parseXml(await read('ppt/_rels/presentation.xml.rels'));
    const map = {};
    for (const r of Array.from(rels.getElementsByTagName('Relationship'))) map[r.getAttribute('Id')] = r.getAttribute('Target');
    for (const sl of Array.from(pres.getElementsByTagName('p:sldId'))) { const t = map[sl.getAttribute('r:id')]; if (t) order.push(resolve('ppt/presentation.xml', t)); }
  } catch (e) { order = []; }
  if (!order.length) {
    const num = n => Number((n.match(/(\d+)\.xml$/) || [])[1]) || 0;
    order = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((x, y) => num(x) - num(y));
  }
  const out = [];
  for (let i = 0; i < order.length; i++) {
    say(`Czytam slajd ${i + 1} z ${order.length}…`);
    const xml = await read(order[i]);
    if (!xml) continue;
    const relsXml = await read(order[i].replace(/slides\/(slide\d+\.xml)$/, 'slides/_rels/$1.rels'));
    const rel = {};
    if (relsXml) for (const r of Array.from(parseXml(relsXml).getElementsByTagName('Relationship'))) rel[r.getAttribute('Id')] = {type: (r.getAttribute('Type') || '').split('/').pop(), target: resolve(order[i], r.getAttribute('Target'))};
    const lines = [];
    const walk = async el => {
      for (const c of Array.from(el.children)) {
        const n = c.nodeName;
        if (n === 'a:tbl') { const t = tableMd(c); if (t) lines.push(t); continue; }
        if (n === 'a:p') { const t = paraText(c); if (t) lines.push(t); continue; }
        if (n === 'c:chart') { const r = rel[c.getAttribute('r:id')]; const x = r && await read(r.target); const t = x && chartText(x); if (t) lines.push(t); continue; }
        if (n === 'dgm:relIds') { const r = rel[c.getAttribute('r:dm')]; const x = r && await read(r.target); const t = x && smartArtText(x); if (t) lines.push(t); continue; }
        await walk(c);
      }
    };
    await walk(parseXml(xml).documentElement);
    let notes = [];
    for (const r of Object.values(rel)) if (r.type === 'notesSlide') {
      const nx = await read(r.target);
      if (nx) notes = Array.from(parseXml(nx).getElementsByTagName('a:p')).map(paraText).filter(l => l && !/^\d+$/.test(l));
    }
    out.push(`--- Slajd ${i + 1} ---\n${lines.join('\n')}${notes.length ? `\n[Notatki prowadzącego] ${notes.join(' ')}` : ''}`);
  }
  return out.join('\n\n');
}

// data wykładu z nazwy pliku albo pierwszych dwóch slajdów (późniejsze daty to zwykle przypisy, np. daty ustaw)
function detectMeta(fileName, text) {
  const head = String(fileName).replace(/_+/g, ' ') + '\n' + String(text).split(/--- (?:Slajd|Strona) 3 ---/)[0];
  const m = head.match(/(?:wyk[łl]ad|lecture|vorlesung|zaj[ęe]cia|spotkanie|\bw)\s*(?:nr\.?\s*)?[-_.:]?\s*(\d{1,2})(?!\d|[.\/-]\d)/i);
  const dates = [];
  for (const x of head.matchAll(/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](20\d{2})\b/g)) dates.push([+x[3], +x[2], +x[1]]);
  for (const x of head.matchAll(/\b(20\d{2})-(\d{2})-(\d{2})\b/g)) dates.push([+x[1], +x[2], +x[3]]);
  for (const x of head.matchAll(/\b(\d{1,2})\.?\s+([a-ząćęłńóśźż]+)\s+(20\d{2})\b/gi)) { const mo = MONTHS_PL[x[2].toLowerCase()]; if (mo) dates.push([+x[3], mo, +x[1]]); }
  const lo = addDays(today(), -400), hi = addDays(today(), 45);
  const ok = dates.map(([y, mo, d]) => `${y}-${pad2(mo)}-${pad2(d)}`).filter(d => isYmd(d) && d >= lo && d <= hi && !isNaN(parseYmd(d)));
  return {nr: m ? Number(m[1]) : null, lectureDate: ok[0] || null};
}

// zgaduje przedmiot po nazwie pliku; zwraca id tylko przy wyraźnej przewadze
function guessSubject(text) {
  const hay = ' ' + fold(String(text)).replace(/[^a-z0-9]+/g, ' ') + ' ';
  const scored = S.subjects.map(x => {
    const toks = fold(x.name).split(/[^a-z0-9]+/).filter(t => t.length >= 4 && t !== 'podstawy' && t !== 'jezyk').map(t => t.slice(0, 6));
    // pełna nazwa przedmiotu (zwykle na slajdzie tytułowym) waży najwięcej
    let sc = hay.includes(' ' + fold(x.name).replace(/[^a-z0-9]+/g, ' ').trim() + ' ') ? 8 : 0;
    for (const k of toks.concat(SUBJECT_HINTS[x.id] || [])) sc += Math.min(hay.split(k).length - 1, 5) * (toks.includes(k) ? 2 : 1);
    return {id: x.id, sc};
  }).sort((x, y) => y.sc - x.sc);
  const [best, second] = scored;
  return best && best.sc >= 2 && best.sc >= 1.5 * ((second && second.sc) || 0) ? best.id : null;
}

  if (file.size > 80 * 1048576) throw new Error('Plik jest za duży (ponad 80 MB).');
  if (/\.(ppt|doc)$/.test(name)) throw new Error('To stary format pliku (.ppt lub .doc). Zapisz go jako .pptx albo PDF i spróbuj ponownie.');
  if (name.endsWith('.pptx')) return pptxText(file, say);
  if (name.endsWith('.pdf')) return pdfText(file, say);
  if (name.endsWith('.docx')) { say('Czytam dokument…'); return docxText(file); }
  return file.text();
}
function subjKind(s) {
  const n = fold((s && s.name) || '');
  if (/jezyk|angielsk|niemieck|hiszpansk|francusk|wlosk|rosyjsk/.test(n)) return 'lang';
  if (/finans|rachunkow|ekonom|statyst|matemat|mikro|makro|inwest/.test(n)) return 'calc';
  if (/praw/.test(n)) return 'law';
  return 'theory';
}

function normNote(r) {
  r = r && typeof r === 'object' && !Array.isArray(r) ? r : {};
  const str = v => typeof v === 'string' ? v.trim() : (v == null ? '' : String(v));
  const strs = v => arr(v).map(x => typeof x === 'string' ? x : (x && (x.text || x.content)) || '').map(str).filter(Boolean);
  const idx = v => (v === '' || v == null || !Number.isInteger(Number(v)) || Number(v) < 0) ? null : Number(v);
  const sections = arr(r.sections).map(x => ({heading: str(x && x.heading), body: str(x && x.body)})).filter(x => x.heading || x.body);
  const sec = v => { const i = idx(v); return i != null && i < sections.length ? {sec: i} : {}; };
  // obiekty z wybranymi polami tekstowymi; wiersz bez pola "need" odpada
  const objs = (v, keys, need) => arr(v).filter(x => x && typeof x === 'object').map(x => {
    const o = {};
    for (const k of keys) { const s = str(x[k]); if (s) o[k] = s; }
    return Object.assign(o, sec(x.sec));
  }).filter(o => o[need]);
  return {
    title: str(r.title).slice(0, 200),
    summary: str(r.summary),
    examInfo: arr(r.examInfo).map(x => typeof x === 'string' ? {text: str(x)} : objs([x], ['text', 'src'], 'text')[0]).filter(x => x && x.text),
    deadlines: arr(r.deadlines).map(x => ({type: EV_TYPES[x && x.type] ? x.type : 'inne', date: isYmd(x && x.date) ? x.date : null, title: str(x && x.title), scope: str(x && x.scope)})).filter(x => x.title),
    highYield: strs(r.highYield),
    sections,
    terms: objs(r.terms, ['term', 'def', 'quote', 'source'], 'term'),
    people: objs(r.people, ['name', 'years', 'school', 'work', 'idea'], 'name'),
    formulas: arr(r.formulas).map(x => ({...objs([x], ['name', 'expr', 'when'], 'expr')[0], vars: objs(x && x.vars, ['sym', 'def'], 'sym')})).filter(x => x.expr),
    worked: arr(r.worked).map(x => ({...objs([x], ['title', 'problem', 'result'], 'problem')[0], steps: strs(x && x.steps)})).filter(x => x.problem),
    vocab: objs(r.vocab, ['w', 'pl', 'pos', 'art', 'plural', 'forms', 'ex'], 'w').filter(x => x.pl),
    grammar: arr(r.grammar).map(x => ({...objs([x], ['title', 'rule', 'pattern'], 'rule')[0], examples: objs(x && x.examples, ['t', 'pl'], 't'), exceptions: strs(x && x.exceptions)})).filter(x => x.rule),
    mistakes: objs(r.mistakes, ['wrong', 'right', 'why'], 'right'),
    exercises: arr(r.exercises).map(x => ({...objs([x], ['title', 'instr'], 'title')[0], items: objs(x && x.items, ['q', 'a'], 'q').filter(i => i.a)})).filter(x => x.items.length),
    texts: objs(r.texts, ['title', 'text', 'pl'], 'text'),
    examQuestions: arr(r.examQuestions).map(x => ({...objs([x], ['q', 'outline'], 'q')[0], fromSlides: !!(x && x.fromSlides)})).filter(x => x.q),
    mnemonics: strs(r.mnemonics),
    practice: strs(r.practice || r.clinical),
    literature: strs(r.literature),
    flashcards: arr(r.flashcards).map(x => ({q: str(x && x.q), a: str(x && x.a), ...sec(x && x.sec)})).filter(x => x.q && x.a),
    quiz: arr(r.quiz).map(x => {
      // pary (odpowiedź, wyjaśnienie) filtrowane razem, żeby indeksy się nie rozjechały
      const ex = arr(x && x.explain);
      const pairs = arr(x && x.options).map((o, i) => ({o: str(o), e: str(ex[i]), i})).filter(p => p.o).slice(0, 6);
      const answer = pairs.findIndex(p => p.i === Number(x && x.answer));
      const q = {q: str(x && x.q), options: pairs.map(p => p.o), answer, why: str(x && x.why), ...sec(x && x.sec)};
      if (pairs.some(p => p.e)) q.explain = pairs.map(p => p.e);
      return q;
    }).filter(x => x.q && x.options.length >= 2 && x.answer >= 0),
    tags: strs(r.tags).slice(0, 8),
  };
}

async function runImport() {
  const o = S.ov;
  if (!o || !S.sample) return;
  let s = subjectById(o.sid);
  if (!s) return;
  let text = '';
  try {
    if (o.file) {
      o.stage = 'extract';
      o.status = 'Czytam plik…';
      renderOv();
      text = await extractText(o.file, setLive);
    }
    if ((o.text || '').trim()) text = (text ? text + '\n\n' : '') + o.text.trim();
  } catch (e) {
    if (S.ov === o) impError((e && e.message) || 'Nie udało się odczytać pliku.');
    return;
  }
  if (S.ov !== o) return;
  text = text.trim();
  if (text.length < 200) {
    impError(o.file ? 'W pliku prawie nie ma tekstu, slajdy to pewnie obrazy albo skany. Wyślij plik Claude\'owi w czacie: tam odczyta też obrazy.' : 'Za mało tekstu, żeby zrobić z niego notatki.');
    return;
  }
  o.meta = o.file ? detectMeta(o.file.name, text) : {nr: null, lectureDate: null};
  if (!o.sidChosen) {
    const g = guessSubject((o.file ? o.file.name + ' ' : '') + text.slice(0, 4000));
    if (g && g !== o.sid) { o.sid = g; s = subjectById(g); o.sidGuessed = true; }
  }
  o.cut = text.length > MAX_SOURCE_CHARS;
  if (o.cut) text = text.slice(0, MAX_SOURCE_CHARS);
  o.stage = 'gen';
  o.status = 'Claude czyta prezentację…';
  const ctl = new AbortController();
  o.ctl = ctl;
  renderOv();
  try {
    const raw = await S.sample.json(genPrompt(s, o.file ? o.file.name : 'wklejony tekst', text), {
      signal: ctl.signal,
      cache: false,
      onText: ({text: t}) => setLive(`Claude pisze notatki… ${(t.length / 1000).toFixed(1).replace('.', ',')} tys. znaków`),
    });
    if (S.ov !== o) return;
    const note = normNote(raw);
    if (!note.title && !note.sections.length) throw {code: 'invalid_json'};
    if (!note.title) note.title = (o.file ? o.file.name.replace(/\.[^.]+$/, '') : 'Wykład');
    o.result = note;
    o.stage = 'preview';
    o.ctl = null;
    renderOv();
  } catch (e) {
    if (S.ov !== o) return;
    o.ctl = null;
    if (e && e.code === 'cancelled') { o.stage = 'pick'; renderOv(); return; }
    impError(sampleErr(e));
  }
}
async function saveImport() {
  const o = S.ov, s = o && subjectById(o.sid);
  if (!o || !o.result || !s || o.saving) return;
  const title = (($('#imp-title') || {}).value || o.result.title || 'Wykład').trim();
  const dateEl = $('#imp-date'), lectureDate = dateEl && isYmd(dateEl.value) ? dateEl.value : null;
  if (o.meta) o.meta.lectureDate = lectureDate;

function noteText(n) {
  const L = ['# ' + (n.title || '')];
  const list = (title, xs) => { if (xs.length) L.push(`## ${title}\n` + xs.map(x => '- ' + x).join('\n')); };
  if (n.summary) L.push(n.summary);
  if (arr(n.highYield).length) L.push('## Najważniejsze\n' + arr(n.highYield).map(x => '- ' + x).join('\n'));
  list('Prowadzący mówi', arr(n.examInfo).map(x => typeof x === 'string' ? x : (x && x.text) || '').filter(Boolean).concat(arr(n.deadlines).filter(d => d && d.title).map(d => `${EV_TYPES[d.type] || 'Termin'}: ${d.title}${d.date ? ' (' + d.date + ')' : ''}${d.scope ? ', zakres: ' + d.scope : ''}`)));
  list('Definicje na pamięć', arr(n.terms).filter(t => t && t.quote).map(t => `${t.term}: „${t.quote}”${t.source ? ' (' + t.source + ')' : ''}`));
  list('Słownictwo', arr(n.vocab).filter(v => v && v.w).map(v => `${vocabLabel(v)} = ${v.pl || ''}`));
  for (const g of arr(n.grammar)) if (g && g.rule) L.push(`## ${g.title || 'Gramatyka'}\n${g.rule}${g.pattern ? '\nSchemat: ' + g.pattern : ''}\n` + arr(g.examples).map(e => `- ${e.t}${e.pl ? ' = ' + e.pl : ''}`).join('\n'));
  list('Typowe błędy', arr(n.mistakes).filter(Boolean).map(m => `${m.wrong ? '✗ ' + m.wrong + ' → ' : ''}✓ ${m.right}${m.why ? ' (' + m.why + ')' : ''}`));

function scrollChat() { const p = $('#ov .panel'); if (p) p.scrollTop = p.scrollHeight; }
async function askSend(q) {
  const o = S.ov;
  q = String(q || '').trim();
  if (!o || o.type !== 'ask' || o.busy || !S.sample || !q) return;
  const n = noteById(o.noteId);
  if (!n) return;
  o.turns.push({role: 'user', content: q});
  o.busy = true;
  o.err = null;
  o.draft = '';
  const ctl = new AbortController();
  o.ctl = ctl;
  renderOv();
  scrollChat();
  const ctx = `Jesteś korepetytorem studenta. Poniżej są jego notatki z wykładu. Odpowiadaj po polsku, konkretnie i zwięźle (zwykle do 200 słów), w Markdown. Opieraj się na notatkach; jeśli dodajesz wiedzę spoza nich, krótko to zaznacz.\n\nNOTATKI:\n${noteText(n).slice(0, 60000)}`;
  try {
    const {text} = await S.sample([{role: 'user', content: ctx}].concat(o.turns.slice(-10)), {
      signal: ctl.signal,
      cache: false,
      onText: ({text: t}) => { const el = $('#ask-live'); if (el) { el.innerHTML = md(t); scrollChat(); } },
    });
    if (S.ov !== o) return;
    o.turns.push({role: 'assistant', content: text});
  } catch (e) {
    if (S.ov !== o) return;
    if (e && e.text) o.turns.push({role: 'assistant', content: e.text});
    if (!(e && e.code === 'cancelled')) o.err = sampleErr(e);
  }
  o.busy = false;
  o.ctl = null;
  renderOv();
  scrollChat();
}

function bindEvents() {
  let sw = null;
  document.addEventListener('pointerdown', e => {
    const card = e.pointerType !== 'mouse' && e.target.closest && e.target.closest('#ov .card.swipe');
    if (!card || !S.ov || S.ov.type !== 'review') return;
    sw = {card, id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, on: false};
  });
  document.addEventListener('pointermove', e => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.on) {
      if (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
      if (Math.abs(dx) < 10) return;
      sw.on = true;
      try { sw.card.setPointerCapture(e.pointerId); } catch (err) {}
    }
    sw.dx = dx;
    sw.card.style.transform = `translateX(${dx}px) rotate(${dx / 24}deg)`;
    const k = Math.min(1, Math.abs(dx) / 110), g = sw.card.querySelector('.swipe-tag.good'), b = sw.card.querySelector('.swipe-tag.bad');
    if (g) g.style.opacity = dx > 0 ? k : 0;
    if (b) b.style.opacity = dx < 0 ? k : 0;
  });
  const swEnd = e => {
    if (!sw || e.pointerId !== sw.id) return;
    const s = sw;
    sw = null;
    if (!s.on) return;
    if (Math.abs(s.dx) > Math.min(110, s.card.offsetWidth * .3)) { rate(s.dx > 0 ? 3 : 1); return; }
    s.card.style.transition = 'transform .2s cubic-bezier(.2,.8,.2,1)';
    s.card.style.transform = '';
    s.card.querySelectorAll('.swipe-tag').forEach(t => { t.style.opacity = 0; });
    setTimeout(() => { s.card.style.transition = ''; }, 240);
  };
  document.addEventListener('pointerup', swEnd);
  document.addEventListener('pointercancel', swEnd);
  const typing = () => {
    const a = document.activeElement;
    document.body.classList.toggle('typing', !!a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/.test(a.type))));
  };
  document.addEventListener('focusin', typing);
  document.addEventListener('focusout', () => setTimeout(typing, 0));
  document.addEventListener('click', e => {
    const gap = e.target.closest && e.target.closest('.note.recall .cz:not(.on)');
    if (gap) { gap.classList.add('on'); e.preventDefault(); return; }
    const el = e.target.closest('[data-act]');

    const menu = el.closest('details.menu');
    if (menu) menu.open = false;
    const f = A[el.dataset.act];
    if (f) { e.preventDefault(); f(el, e); }

  document.addEventListener('submit', e => {

    if (e.target.id === 'subj-form') submitSubject();

      const art = $('.note'), bar = $('#read-i');

  window.addEventListener('pageshow', onShow);
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.ov && (S.ov.type === 'editor' || S.ov.type === 'mynotes')) {
      e.preventDefault();
      if (S.ov.type === 'editor') saveEditor(false); else saveMyNotes();
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target, o = S.ov;
    if (t && t.id === 'ask-q' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askSend(t.value); return; }
    if (!o) {
      if ((e.key === 'Enter' || e.key === ' ') && t && t.classList && t.classList.contains('cal-day')) { e.preventDefault(); A['cal-day'](t); }
      return;
    }
    const locked = (o.type === 'import' && (o.stage === 'gen' || o.stage === 'extract')) || (o.type === 'ask' && o.busy) || ((o.type === 'editor' || o.type === 'mynotes') && !!o.busy);
    if (e.key === 'Escape') { if (!locked) { e.preventDefault(); requestCloseOv(); } return; }
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if ((e.key === 'Enter' || e.key === ' ') && t && t.tagName === 'BUTTON' && !t.matches('[data-act="flip"],[data-act="quiz-next"],[data-act="rv-mcq-next"]')) return;
    if (o.type === 'review' && o.i < o.q.length) {
      const c = o.q[o.i];
      if (c.kind === 'mcq') {
        if (o.mcq === null) { const j = '1234'.indexOf(e.key) >= 0 ? '1234'.indexOf(e.key) : 'abcd'.indexOf(e.key.toLowerCase()); if (j >= 0 && c.order && j < c.order.length) { e.preventDefault(); o.mcq = c.order[j]; o.anim = 'pick'; renderOv(); } }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); A['rv-mcq-next'](); }
      }
      else if (!o.flipped && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); flipCard(); }
      else if (o.flipped && /^[1234]$/.test(e.key)) { e.preventDefault(); rate(Number(e.key)); }
    } else if (o.type === 'quiz' && o.i < o.qs.length) {
      if (o.picked === null) {
        let j = '1234'.indexOf(e.key);
        if (j < 0) j = 'abcd'.indexOf(e.key.toLowerCase());
        const order = o.qs[o.i].order;
        if (j >= 0 && j < order.length) { e.preventDefault(); pick(order[j]); }
      } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); quizNext(); }
    }
  });
}

boot();
})();

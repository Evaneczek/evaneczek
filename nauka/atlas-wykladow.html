<title>Atlas Wykładów</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap">
<style>
:root{
  /* Layout: a binder index of stained tabs on the left, one reading column (~70ch) on the right */
  --bg:#F3F4F8;
  --surface:#FFFFFF;
  --sunk:#E9EBF2;
  --ink:#191A2B;
  --muted:#5A5D76;
  --faint:#8A8DA6;
  --line:#DADDE8;
  --accent:#3E3C9C;
  --accent-ink:#FFFFFF;
  --accent-soft:#E5E5F6;
  --mark:#F8CCDA;            /* zakreślacz */
  --mark-ink:#8C1D45;
  --good:#1D7149; --good-soft:#DCF0E4;
  --warn:#9A5300; --warn-soft:#FAE9D2;
  --bad:#B0233B;  --bad-soft:#F8DEE3;
  --scrim:rgba(20,21,36,.42);
  --shadow:0 1px 2px rgba(25,26,43,.06), 0 8px 24px rgba(25,26,43,.08);
  --s-malina:#C8396A; --s-indygo:#4543A5; --s-morski:#127C6B; --s-pomarancz:#BF521D; --s-granat:#1B5BA0;
  --s-sliwka:#982A86; --s-oliwka:#4C7F20; --s-braz:#6A5745; --s-miod:#9A6F00; --s-grafit:#4F5A6B;
  --f-read:"Literata","Iowan Old Style",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101119; --surface:#181A26; --sunk:#212335; --ink:#E6E7F2; --muted:#A0A3BE; --faint:#6F7290; --line:#2C2E43;
    --accent:#A6A4F8; --accent-ink:#15142C; --accent-soft:#2A2957;
    --mark:#5B2139; --mark-ink:#FFC4D6;
    --good:#63D19B; --good-soft:#163426; --warn:#F0B260; --warn-soft:#382811; --bad:#FF8C9D; --bad-soft:#3B1822;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    --s-malina:#F07CA2; --s-indygo:#9593F2; --s-morski:#45C7B0; --s-pomarancz:#F08C58; --s-granat:#6EA8F0;
    --s-sliwka:#DD78CB; --s-oliwka:#9ACB62; --s-braz:#BBA791; --s-miod:#E6BC4A; --s-grafit:#A3AEBF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101119; --surface:#181A26; --sunk:#212335; --ink:#E6E7F2; --muted:#A0A3BE; --faint:#6F7290; --line:#2C2E43;
  --accent:#A6A4F8; --accent-ink:#15142C; --accent-soft:#2A2957;
  --mark:#5B2139; --mark-ink:#FFC4D6;
  --good:#63D19B; --good-soft:#163426; --warn:#F0B260; --warn-soft:#382811; --bad:#FF8C9D; --bad-soft:#3B1822;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --s-malina:#F07CA2; --s-indygo:#9593F2; --s-morski:#45C7B0; --s-pomarancz:#F08C58; --s-granat:#6EA8F0;
  --s-sliwka:#DD78CB; --s-oliwka:#9ACB62; --s-braz:#BBA791; --s-miod:#E6BC4A; --s-grafit:#A3AEBF;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#main:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.label{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);gap:48px;max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
.rail{position:sticky;top:28px;align-self:start;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 56px);overflow-y:auto;padding:2px 4px 2px 2px}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px;border:0;background:transparent;text-align:left;color:var(--ink)}
.brand-mark{width:36px;height:28px;flex:none}
.bm-back{fill:var(--accent);fill-opacity:.85}
.bm-card{fill:var(--surface);stroke:var(--line);stroke-width:1}
.bm-hl{fill:var(--mark)}
.bm-line{fill:var(--faint)}
.brand-name{display:block;font-family:var(--f-read);font-weight:600;font-size:18px;letter-spacing:-.01em;line-height:1.15}
.brand-sub{display:block;font-size:12px;color:var(--muted)}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#rail-nav{display:flex;flex-direction:column;gap:2px}
.nav-label{margin:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;color:var(--ink)}
.nav-item:hover{background:var(--sunk)}
.nav-item.on{background:var(--surface);border-color:var(--line);font-weight:600}
.nav-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.nav-item.add{color:var(--accent);font-weight:500;margin-top:6px}
.sw{display:inline-block;width:12px;height:12px;flex:none;border-radius:52% 44% 56% 46% / 48% 56% 44% 52%;background:var(--c,var(--accent))}
.sw.lg{width:22px;height:20px}
.sw.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}
.sw.cal{border-radius:3px;background:linear-gradient(var(--faint) 0 3.5px,transparent 3.5px);box-shadow:inset 0 0 0 1.5px var(--faint)}

@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr);gap:22px;padding-block:16px 56px}
  .rail{position:static;max-height:none;overflow:visible;gap:12px;padding:0}
  #rail-nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  #rail-nav::-webkit-scrollbar{display:none}
  .nav-label{display:none}
  .nav-item{width:auto;flex:none;white-space:nowrap;border-color:var(--line);background:var(--surface)}
  .nav-item.on{border-color:var(--ink)}
  .nav-item.add{margin-top:0}
  .nav-name{overflow:visible}
}

/* ---------- headings & buttons ---------- */
.head{display:flex;flex-direction:column;gap:10px;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-family:var(--f-read);font-weight:600;font-size:clamp(28px,3.6vw,40px);line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head-meta{margin:0;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.actions,.row{display:flex;gap:8px;align-items:center}
.actions,.row.wrap{flex-wrap:wrap}
.actions{margin-top:6px}
.row.end{justify-content:flex-end;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:500;line-height:1.2;text-align:center;transition:background-color .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){border-color:var(--accent);filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){background:var(--sunk);border-color:transparent;color:var(--ink)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:13.5px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.danger-text,.btn.ghost.danger-text{color:var(--bad)}
.btn.wide{width:100%;min-height:50px;font-size:16px}
.kbd{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid currentColor;opacity:.7;font-weight:400}

/* ---------- home ---------- */
.today{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 28px;align-items:end;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:40px}
.today p{margin:0}
.today-num{margin-top:6px!important;font-size:18px}
.big{font-family:var(--f-read);font-size:58px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-right:6px}
.today-side{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.act-cells{display:grid;grid-template-columns:repeat(14,14px);gap:4px}
.act-cells i{display:block;width:14px;height:14px;border-radius:3px;background:var(--sunk)}
.act-cells .lv1{background:color-mix(in srgb,var(--accent) 28%,var(--sunk))}
.act-cells .lv2{background:color-mix(in srgb,var(--accent) 50%,var(--sunk))}
.act-cells .lv3{background:color-mix(in srgb,var(--accent) 75%,var(--sunk))}
.act-cells .lv4{background:var(--accent)}
@media (max-width:640px){
  .today{grid-template-columns:minmax(0,1fr);padding:20px}
  .today-side,.act{align-items:stretch}
}
.block{margin-bottom:42px}
.block-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;margin-bottom:14px}
.h2{margin:0 0 14px;font-family:var(--f-read);font-size:21px;font-weight:600;letter-spacing:-.01em}
.block-head .h2{margin:0}
.exams{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.exam{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.exam:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.exam-name{flex:1;min-width:0;font-weight:600}
.exam-date{color:var(--muted);font-size:14px}
.exam-prog{flex-basis:100%;padding-left:24px;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.subj-card{display:flex;flex-direction:column;gap:8px;padding:16px;min-height:158px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;transition:border-color .15s}
.subj-card:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.subj-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.subj-name{font-family:var(--f-read);font-size:20px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.subj-meta{font-size:13.5px;color:var(--muted)}
.subj-meta b{color:var(--accent);font-weight:600}
.subj-foot{margin-top:auto;font-size:12.5px;color:var(--muted)}
/* długie opisy nurtu w „Kto jest kim” zawijają się zamiast rozpychać stronę */
.head-meta{overflow-wrap:anywhere}   /* długie nazwy plików bez spacji */
.tl .pill{white-space:normal;max-width:100%;text-align:left;line-height:1.35}
.radio{display:inline-flex;align-items:center;gap:7px;min-height:32px;font-size:14.5px;cursor:pointer}
.radio input{accent-color:var(--accent);width:16px;height:16px;margin:0}
@media (max-width:640px){
  .subj-grid{gap:8px}
  .subj-card{min-height:0;gap:5px;padding:12px 14px 12px 14px;border-left:4px solid var(--c)}
  .subj-top{display:none}
  .subj-top:has(.tag-ex){display:flex}
  .subj-top:has(.tag-ex) .sw{display:none}
  .subj-name{font-size:17.5px}
}
.bar{display:flex;width:100%;height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%}
.b-good{background:var(--good)}
.b-mid{background:color-mix(in srgb,var(--warn) 65%,var(--sunk))}
.tag-ex{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mark-ink);background:var(--mark);padding:2px 7px;border-radius:4px;line-height:1.4}
.recent{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.recent-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.recent-row .sw{grid-row:span 2}
.recent-title{font-family:var(--f-read);font-size:16.5px;font-weight:500}
.recent-row:hover .recent-title{color:var(--accent)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.how{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:18px;border-radius:12px;background:var(--sunk)}
.how h3{margin:0;font-family:var(--f-read);font-size:16.5px;font-weight:600}
.how p{margin:0;color:var(--muted);font-size:14px}
.how .btn{margin-top:auto}
.banner{display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;margin-bottom:28px;border-radius:12px;background:color-mix(in srgb,var(--mark) 50%,var(--surface))}
.banner > div:first-child{flex:1 1 320px;min-width:0}
.banner p{margin:0}
.banner-title{font-weight:600;margin-bottom:2px!important}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:28px;margin-bottom:36px;border:1.5px dashed var(--line);border-radius:14px}
.empty p{margin:0;max-width:62ch}
.empty-title{font-family:var(--f-read);font-size:20px;font-weight:600}
.sk{height:14px;border-radius:6px;background:var(--sunk)}
.loading{display:flex;flex-direction:column;gap:12px;max-width:560px}
.loading p{margin:6px 0 0}

/* ---------- plan zajęć ---------- */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px 24px}
.day-t{margin:0 0 8px;font-size:14px;font-weight:600}
.cls-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.cls{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start;width:100%;padding:10px 12px;border:1px solid color-mix(in srgb,var(--c) 24%,var(--line));border-radius:10px;background:color-mix(in srgb,var(--c) 7%,var(--surface));color:var(--ink);text-align:left}
button.cls:hover{border-color:color-mix(in srgb,var(--c) 65%,var(--line))}
.cls-time{padding-top:1px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cls-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.cls-name{display:flex;align-items:center;gap:7px;font-weight:600;line-height:1.3}
.cls-meta{font-size:12.5px;color:var(--muted)}
.cls-type{font-weight:600;color:var(--ink)}
.week{margin-bottom:36px}
.week .h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.week-grid{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:10px}
.wday{min-width:0}
.wday.past{opacity:.5}
.wday.is-today .day-t{color:var(--accent)}
.week-grid .cls{grid-template-columns:minmax(0,1fr)}
.week-grid .cls-name{align-items:flex-start;overflow-wrap:anywhere}
.week-grid .cls-name .sw{margin-top:4px}
.past-weeks summary{cursor:pointer;color:var(--muted);font-weight:500;margin-bottom:16px}
@media (max-width:1080px){
  .week-grid{grid-template-columns:minmax(0,1fr)}
  .week-grid .cls{grid-template-columns:auto minmax(0,1fr)}
}
.subj-classes{margin-top:36px}

/* ---------- kalendarz ---------- */
.ev-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ev-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left}
.ev-row:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.ev-row.done{opacity:.6}
.ev-date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;padding:4px 0 5px;border-radius:9px;background:color-mix(in srgb,var(--c) 13%,var(--surface));color:var(--ink);line-height:1.05}
.ev-date b{font-family:var(--f-read);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.ev-date span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ev-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev-title{font-weight:600;line-height:1.3}
.ev-meta{font-size:12.5px;color:var(--muted)}
@media (max-width:480px){ .ev-row{gap:10px;padding:8px 10px 8px 8px} .ev-row .pill{font-size:11.5px;padding:2px 7px} .ev-date{width:42px} }
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-title{margin:0 6px;font-family:var(--f-read);font-size:22px;font-weight:600;min-width:9ch;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cal-dow{padding:7px 8px;background:var(--sunk);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal-day{display:flex;flex-direction:column;gap:3px;min-width:0;min-height:104px;padding:6px;background:var(--surface)}
.cal-day[data-act]{cursor:pointer}
.cal-day[data-act]:hover{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.cal-day.out{background:var(--bg)}
.cal-day.out .cal-num{color:var(--faint)}
.cal-num{align-self:flex-start;display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;font-size:12.5px;font-variant-numeric:tabular-nums}
.cal-day.cal-today .cal-num{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal-ev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;width:100%;padding:2px 6px;border:0;border-radius:5px;background:color-mix(in srgb,var(--c) 17%,var(--surface));color:var(--ink);font-size:12px;line-height:1.3;text-align:left;overflow:hidden;overflow-wrap:anywhere}
.cal-ev:hover{background:color-mix(in srgb,var(--c) 30%,var(--surface))}
.cal-ev.done{opacity:.55;text-decoration:line-through}
@media (max-width:640px){
  .cal-day{min-height:58px;padding:4px;flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:3px}
  .cal-num{flex-basis:100%;min-width:22px;height:22px;padding:0 4px;font-size:12px}
  .cal-ev{width:9px;height:9px;padding:0;border-radius:50%;background:var(--c);font-size:0}
  .cal-dow{padding:6px 4px;text-align:center;font-size:10px}
}
.ev-when{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0;color:var(--muted)}

function schedule(st, g, examDate) {
  const t = today();

  const ret = examIn != null && examIn >= 0 && examIn <= 7 ? 0.95 : 0.9;

function viewPlan() {
  const items = planItems(), t = today(), cur = weekStart(t);
  let h = `<header class="head"><p class="eyebrow">${dateLine()}</p><h1>Plan zajęć</h1>${items.length ? `<p class="head-meta">${esc(fmtDay(items[0].d))} – ${esc(fmtDay(items[items.length - 1].d))} · ${pl(items.length, 'zajęcia', 'zajęcia', 'zajęć')}</p>` : ''}</header>`;
  if (!items.length) return h + `<div class="empty"><p class="empty-title">Plan jest pusty</p><p class="muted">Wyślij Claude'owi w czacie zrzut ekranu planu zajęć, a pojawi się tutaj razem z najbliższymi zajęciami na pulpicie.</p></div>`;
  const weeks = new Map();
  for (const x of items) { const w = weekStart(x.d); if (!weeks.has(w)) weeks.set(w, []); weeks.get(w).push(x); }
  const weekBlock = (w, xs) => {
    const shown = [0, 1, 2, 3, 4, 5, 6].filter(i => i < 5 || xs.some(x => x.d === addDays(w, i)));
    let days = '';
    for (const i of shown) {
      const d = addDays(w, i), ds = xs.filter(x => x.d === d);
      days += `<div class="wday ${d < t ? 'past' : ''} ${d === t ? 'is-today' : ''}"><p class="day-t">${esc(cap(fmtDay(d, {weekday: 'short', day: 'numeric', month: 'numeric'})))}${d === t ? ' · dziś' : ''}</p>${ds.length ? `<ul class="cls-list">${ds.map(x => classRow(x)).join('')}</ul>` : '<p class="muted small" style="margin:0">wolne</p>'}</div>`;
    }
    return `<section class="week"><h2 class="h2">${esc(fmtDay(w))} – ${esc(fmtDay(addDays(w, shown[shown.length - 1])))}${w === cur ? ' <span class="pill neutral">ten tydzień</span>' : ''}</h2><div class="week-grid" style="--cols:${shown.length}">${days}</div></section>`;
  };
  const all = [...weeks];
  h += all.filter(([w]) => w >= cur).map(([w, xs]) => weekBlock(w, xs)).join('');
  const past = all.filter(([w]) => w < cur);
  if (past.length) h += `<details class="past-weeks" data-k="past-weeks" ${S.openDetails.has('past-weeks') ? 'open' : ''}><summary>Minione tygodnie (${past.length})</summary>${past.map(([w, xs]) => weekBlock(w, xs)).join('')}</details>`;
  return h;
}

/* ---------- kalendarz: sprawdziany, zaliczenia, projekty ---------- */
const EV_TYPES = {sprawdzian: 'Sprawdzian', kolokwium: 'Kolokwium', zaliczenie: 'Zaliczenie', egzamin: 'Egzamin', projekt: 'Projekt', prezentacja: 'Prezentacja', inne: 'Inne'};
const evTypeName = k => EV_TYPES[k] || EV_TYPES.inne;
const evHasSteps = e => e.type === 'projekt' || e.type === 'prezentacja' || arr(e.checklist).length > 0;
function allEvents() {
  const out = S.events.filter(e => e && isYmd(e.date));
  // stare pole subjects.exam pokazujemy jako egzamin, dopóki nie ma go w kalendarzu
  for (const s of S.subjects) {
    if (isYmd(s.exam) && !out.some(e => e.type === 'egzamin' && e.subjectId === s.id)) out.push({id: 'exam-' + s.id, virtual: true, type: 'egzamin', subjectId: s.id, date: s.exam});
  }
  return out.sort((a, b) => (a.date + (a.time || '99:99')).localeCompare(b.date + (b.time || '99:99')));
}
const eventById = id => S.events.find(e => e.id === id);
function evTitle(e) {
  if (e.title) return e.title;
  const s = subjectById(e.subjectId);
  return evTypeName(e.type) + (s ? ' · ' + s.name : '');
}
const evColor = e => { const s = subjectById(e.subjectId); return s ? cvar(s.stain) : '--c:var(--accent)'; };
function upcomingEvents(sid) {
  const t = today();
  return allEvents().filter(e => (!sid || e.subjectId === sid) && !e.done && e.date >= t);
}
function overdueEvents(sid) {
  const t = today();
  return allEvents().filter(e => (!sid || e.subjectId === sid) && !e.done && e.date < t && evHasSteps(e));
}
function evPill(e) {
  if (e.done) return '<span class="pill good">zrobione</span>';
  const d = daysUntil(e.date);
  if (d < 0) return evHasSteps(e) ? '<span class="pill bad">po terminie</span>' : `<span class="pill neutral">${inDays(d)}</span>`;
  return `<span class="pill ${d <= 2 ? 'bad' : d <= 7 ? 'warn' : 'neutral'}">${inDays(d)}</span>`;
}
function evRow(e) {
  const s = subjectById(e.subjectId), d = parseYmd(e.date);
  const meta = [];
  if (e.title) { meta.push(evTypeName(e.type)); if (s) meta.push(esc(s.name)); }
  if (e.time) meta.push(esc(e.time));
  if (e.place) meta.push(esc(e.place));
  const ck = arr(e.checklist);
  if (ck.length) meta.push(`kroki ${ck.filter(x => x && x.done).length}/${ck.length}`);
  const nl = arr(e.lectureIds).map(noteById).filter(Boolean).length;
  if (nl) meta.push(`zakres: ${pl(nl, ...unitOf(e.subjectId).slice(1))}`);
  if (e.done && e.grade) meta.push('wynik: ' + esc(e.grade));
  return `<li><button class="ev-row ${e.done ? 'done' : ''}" data-act="ev-open" data-id="${esc(e.id)}" style="${evColor(e)}">
    <span class="ev-date"><b>${d.getDate()}</b><span>${esc(d.toLocaleDateString('pl-PL', {month: 'short'}).replace('.', ''))}</span></span>
    <span class="ev-main"><span class="ev-title">${esc(evTitle(e))}</span><span class="ev-meta">${meta.join(' · ')}</span></span>
    ${evPill(e)}</button></li>`;
}
function prepCard() {
  const e = upcomingEvents().find(x => EXAM_TYPES.includes(x.type) && daysUntil(x.date) <= 7 && eventNotes(x).length);
  if (!e) return '';
  const ns = eventNotes(e), items = ns.reduce((a, n) => a + itemsOf(n).filter(c => c.kind !== 'mcq').length, 0), qs = ns.reduce((a, n) => a + arr(n.quiz).length, 0);
  if (!items && !qs) return '';
  return `<div class="prep-card" style="${evColor(e)}"><div><p class="label">Przygotuj się</p><p class="prep-t">${esc(evTitle(e))} · ${inDays(daysUntil(e.date))}</p><p class="muted small">Zakres: ${pl(ns.length, ...unitOf(e.subjectId).slice(1))}</p></div>
    <div class="row wrap">${items ? `<button class="btn primary sm" data-act="review" data-kind="event" data-id="${esc(e.id)}">Powtórz materiał</button>` : ''}${qs ? `<button class="btn sm" data-act="quiz" data-kind="event" data-id="${esc(e.id)}">Test z zakresu</button>` : ''}</div></div>`;
}
function eventsBlock() {
  const list = overdueEvents().concat(upcomingEvents()).slice(0, 6);
  const more = upcomingEvents().length + overdueEvents().length - list.length;
  return `<section class="block"><div class="block-head"><h2 class="h2">Najbliższe terminy</h2><div class="row">${canWrite() ? '<button class="btn ghost sm" data-act="ev-new">+ Dodaj termin</button>' : ''}<button class="btn ghost sm" data-act="go-cal">Kalendarz</button></div></div>${prepCard()}
    ${list.length ? `<ul class="ev-list">${list.map(evRow).join('')}</ul>${more > 0 ? `<p class="muted small" style="margin:8px 0 0">i jeszcze ${pl(more, 'termin', 'terminy', 'terminów')} w kalendarzu</p>` : ''}`
      : `<p class="muted" style="margin:0">Brak zaplanowanych sprawdzianów, kolokwiów, zaliczeń i projektów. Dodaj termin, a pojawi się tutaj z odliczaniem dni.</p>`}</section>`;
}
function viewCalendar() {
  const t = today(), ym = S.calMonth || t.slice(0, 7);
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const start = addDays(ymd(first), -((first.getDay() + 6) % 7));
  const end = ymd(new Date(y, m, 0));
  const evs = allEvents(), byDay = {};
  for (const e of evs) (byDay[e.date] || (byDay[e.date] = [])).push(e);
  let n = 0;
  while (addDays(start, n) <= end) n++;
  const cellsCount = Math.ceil(n / 7) * 7;
  let cells = ['pon', 'wt', 'śr', 'czw', 'pt', 'sob', 'niedz'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < cellsCount; i++) {
    const d = addDays(start, i), es = byDay[d] || [];
    const dayLabelTxt = `${fmtDay(d, {weekday: 'long', day: 'numeric', month: 'long'})}${es.length ? ', ' + pl(es.length, 'termin', 'terminy', 'terminów') : ''}`;
    cells += `<div class="cal-day ${d.slice(0, 7) !== ym ? 'out' : ''} ${d === t ? 'cal-today' : ''}" ${es.length || canWrite() ? `data-act="cal-day" data-date="${d}" role="button" tabindex="0" aria-label="${esc(dayLabelTxt)}"` : ''}>
      <span class="cal-num">${Number(d.slice(8))}</span>${es.map(e => `<button class="cal-ev ${e.done ? 'done' : ''}" data-act="ev-open" data-id="${esc(e.id)}" style="${evColor(e)}" title="${esc(evTitle(e))}">${esc(evTitle(e))}</button>`).join('')}</div>`;
  }
  const monthEvs = evs.filter(e => e.date.slice(0, 7) === ym);
  const title = cap(first.toLocaleDateString('pl-PL', {month: 'long', year: 'numeric'}));
  return `<header class="head"><p class="eyebrow">${dateLine()}</p><h1>Kalendarz</h1><p class="head-meta">Sprawdziany, kolokwia, zaliczenia, egzaminy i projekty z odliczaniem.</p>
    ${canWrite() ? '<div class="actions"><button class="btn primary" data-act="ev-new">Dodaj termin</button></div>' : ''}</header>
  <div class="cal-head"><button class="btn sm" data-act="cal-move" data-dir="-1" aria-label="Poprzedni miesiąc">←</button><h2 class="cal-title">${esc(title)}</h2><button class="btn sm" data-act="cal-move" data-dir="1" aria-label="Następny miesiąc">→</button>${ym !== t.slice(0, 7) ? '<button class="btn ghost sm" data-act="cal-today">Wróć do dziś</button>' : ''}</div>
  <div class="cal-grid">${cells}</div>
  <section class="block" style="margin-top:28px"><h2 class="h2">Terminy w tym miesiącu</h2>${monthEvs.length ? `<ul class="ev-list">${monthEvs.map(evRow).join('')}</ul>` : `<p class="muted" style="margin:0">Brak terminów w tym miesiącu.${canWrite() ? ' Kliknij dzień w kalendarzu, żeby dodać termin.' : ''}</p>`}</section>`;
}

function statusCount(ns) {
  const c = {umiem: 0, czytam: 0};
  for (const n of ns) { const st = statusOf(n.id); if (st in c) c[st]++; }
  return c;
}

/* ---------- postęp: prywatny dla osoby (data/users/<id>), awaryjnie w przeglądarce ---------- */
const timers = new Map(), chains = new Map(), dirty = new Set();
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({prog: S.prog, stats: S.stats})); } catch (e) {} }
function loadLocal() {
  try {
    const v = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (v) { S.prog = v.prog || {}; S.stats = v.stats || {days: {}}; }
  } catch (e) {}
}
function saveProg(key) {             // key = id notatki albo '__stats'
  dirty.add(key);
  clearTimeout(timers.get(key));
  timers.set(key, setTimeout(() => flush(key), 800));
  if (!S.uid) saveLocal();
}
function flush(key) {
  timers.delete(key);
  if (!S.db || !S.uid) { dirty.delete(key); saveLocal(); return; }
  const body = key === '__stats' ? S.stats : S.prog[key];
  if (!body) { dirty.delete(key); return; }
  const data = clone(body);
  const docId = key === '__stats' ? 'stats' : 'n_' + key;
  const p = (chains.get(key) || Promise.resolve())
    .then(() => S.db.collection('data/users/' + S.uid).doc(docId).set(data))
    .catch(e => {
      console.warn('zapis postępu', e);
      if (e && e.code === 'invalid_argument') { S.uid = null; saveLocal(); toast('Postęp zapisuje się teraz tylko w tej przeglądarce.'); }
    })
    .finally(() => { if (chains.get(key) === p) { chains.delete(key); if (!timers.has(key)) dirty.delete(key); } });
  chains.set(key, p);
}
function onUserSnap(snap) {
  let changed = false;
  for (const d of snap.docs) {
    const data = d.data();
    if (d.id === 'stats') {
      if (dirty.has('__stats')) continue;
      if (JSON.stringify(data) !== JSON.stringify(S.stats)) { S.stats = clone(data); changed = true; }
    } else if (d.id.startsWith('n_')) {
      const k = d.id.slice(2);
      if (dirty.has(k)) continue;
      if (JSON.stringify(data) !== JSON.stringify(S.prog[k])) { S.prog[k] = clone(data); changed = true; }
    }
  }
  if (changed) scheduleRender();
}
function bumpStats(isNew) {
  const t = today();
  if (!S.stats.days) S.stats.days = {};
  const days = S.stats.days;
  days[t] = (days[t] || 0) + 1;
  const cutoff = addDays(t, -90);
  for (const k of Object.keys(days)) if (k < cutoff) delete days[k];
  if (isNew) {
    if (!S.stats.newDays) S.stats.newDays = {};
    const nd = S.stats.newDays;
    nd[t] = (nd[t] || 0) + 1;
    for (const k of Object.keys(nd)) if (k < addDays(t, -30)) delete nd[k];
  }
  saveProg('__stats');
}

/* ================= start ================= */
const use = name => {
  try {
    return (window.claude && typeof window.claude.use === 'function')
      ? Promise.resolve(window.claude.use(name)).catch(() => null) : Promise.resolve(null);
  } catch (e) { return Promise.resolve(null); }
};

async function boot() {
  document.documentElement.lang = 'pl';
  bindEvents();
  render();
  use('sample').then(s => { S.sample = s || null; scheduleRender(); });
  const user = await use('user');
  if (user) {
    try { S.uid = await user.id(); } catch (e) { S.uid = null; }
    try { S.canWrite = await user.can('data.write'); } catch (e) { S.canWrite = null; }
  }
  const db = await use('db');
  if (!db) { S.phase = 'nodb'; loadLocal(); render(); return; }
  S.db = db;
  S.phase = 'loading';
  if (!S.uid) loadLocal();
  const fail = e => { console.warn(e); S.phase = 'error'; S.err = e && e.code; render(); };
  db.collection('subjects').onSnapshot(snap => {
    S.subjects = snap.docs.map(d => ({...d.data(), id: d.id}));
    S.got.subjects = true; ready();
  }, fail);
  db.collection('notes').onSnapshot(snap => {
    S.notes = snap.docs.map(d => ({...d.data(), id: d.id}));
    S.got.notes = true; ready();
  }, fail);
  db.doc('meta/info').onSnapshot(d => { S.meta = d.exists ? {...d.data()} : {}; scheduleRender(); }, () => {});
  db.collection('events').onSnapshot(snap => {
    S.events = snap.docs.map(d => ({...d.data(), id: d.id}));
    scheduleRender();
  }, e => console.warn('terminy', e));
  db.doc('meta/plan').onSnapshot(d => { S.plan = d.exists ? {...d.data()} : {}; scheduleRender(); }, () => {});
  if (S.uid) db.collection('data/users/' + S.uid).onSnapshot(onUserSnap, e => console.warn('postęp', e));
}
function ready() { if (S.got.subjects && S.got.notes) S.phase = 'ready'; scheduleRender(); }

/* ================= render ================= */
let rq = 0;
function scheduleRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }
let lastClock = '';
const clockKey = () => today() + '|' + upcoming().length;
function render() {
  renderRail();
  renderMain();
  lastClock = clockKey();
  // podgląd terminu pokazuje dane z bazy, więc odświeżamy go razem ze stroną (formularzy nie ruszamy)
  if (S.ov && S.ov.type === 'event' && S.ov.mode === 'view') renderOv();
}

function renderRail() {
  const v = S.view;
  const activeSid = v.name === 'subject' ? v.id : v.name === 'note' ? (noteById(v.id) || {}).subjectId : null;
  let h = `<button class="nav-item ${v.name === 'home' ? 'on' : ''}" data-act="go-home"><span class="sw ring"></span><span class="nav-name">Pulpit</span></button>`;
  h += `<button class="nav-item ${v.name === 'calendar' ? 'on' : ''}" data-act="go-cal"><span class="sw cal"></span><span class="nav-name">Kalendarz</span>${upcomingEvents().length ? `<span class="nav-count" title="Nadchodzące terminy">${upcomingEvents().length}</span>` : ''}</button>`;
  if (planItems().length) h += `<button class="nav-item ${v.name === 'plan' ? 'on' : ''}" data-act="go-plan"><span class="sw cal"></span><span class="nav-name">Plan zajęć</span></button>`;
  const subs = subjectsSorted();
  if (subs.length) h += `<p class="label nav-label">Przedmioty</p>`;
  for (const s of subs) {
    h += `<button class="nav-item ${activeSid === s.id ? 'on' : ''}" data-act="go-subject" data-id="${esc(s.id)}" style="${cvar(s.stain)}"><span class="sw"></span><span class="nav-name">${esc(s.name)}</span><span class="nav-count">${notesOf(s.id).length}</span></button>`;
  }
  if (S.phase === 'ready' && canWrite()) h += `<button class="nav-item add" data-act="new-subject">+ Dodaj przedmiot</button>`;
  const tb = $('#tabbar');
  if (tb) {
    const due = S.phase === 'ready' ? cardStats(S.notes).due : 0;
    const I = {
      home: '<path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',
      rev: '<rect x="4" y="7.5" width="12.5" height="13" rx="2"/><path d="M8 4.5h10.5a1.5 1.5 0 0 1 1.5 1.5v11"/>',
      cal: '<rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3.5v4M15 3.5v4"/>',
      find: '<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>'};
    const tab = (act, key, label, on, extra = '') => `<button class="tab ${on ? 'on' : ''}" data-act="${act}" ${extra}${on ? ' aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${I[key]}</svg>${label}</button>`;
    tb.innerHTML = tab('go-home', 'home', 'Pulpit', v.name === 'home') +
      tab('review', 'rev', `Powtórka${due ? `<span class="tab-badge">${due > 99 ? '99+' : due}</span>` : ''}`, false, 'data-kind="all"') +
      tab('go-cal', 'cal', 'Kalendarz', v.name === 'calendar') +
      tab('tab-search', 'find', 'Szukaj', v.name === 'search');
    tb.hidden = S.phase !== 'ready';
  }
  const nav = $('#rail-nav');
  nav.innerHTML = h;
  // na telefonie menu jest poziomym paskiem: aktywna pozycja ma być widoczna
  const on = nav.querySelector('.nav-item.on');
  if (on && nav.scrollWidth > nav.clientWidth) {
    const a = on.getBoundingClientRect(), b = nav.getBoundingClientRect();
    if (a.left < b.left || a.right > b.right) nav.scrollLeft += a.left - b.left - 16;
  }
}

function renderMain() {
  const m = $('#main');
  if (S.phase === 'boot' || S.phase === 'loading') { m.innerHTML = viewLoading(); return; }
  if (S.phase === 'nodb') { m.innerHTML = viewNoDb(); return; }
  if (S.phase === 'error') { m.innerHTML = viewError(); return; }
  const v = S.view;
  m.innerHTML = v.name === 'subject' ? viewSubject(v.id)
    : v.name === 'note' ? viewNote(v.id)
    : v.name === 'search' ? viewSearch()
    : v.name === 'plan' ? viewPlan()
    : v.name === 'calendar' ? viewCalendar()
    : viewHome();
  if (v.name === 'note' && S.recall) applyRecall(m.querySelector('.note'));
}

const dateLine = () => esc(cap(new Date().toLocaleDateString('pl-PL', {weekday: 'long', day: 'numeric', month: 'long'})));

function viewLoading() {
  return `<header class="head"><p class="eyebrow">${dateLine()}</p><h1>Pulpit</h1></header>
  <div class="loading"><div class="sk" style="width:72%"></div><div class="sk" style="width:54%"></div><div class="sk" style="width:63%"></div>
  <p class="muted">Wczytuję przedmioty, wykłady i Twoje powtórki…</p></div>`;
}
function viewNoDb() {
  return `<header class="head"><p class="eyebrow">Atlas Wykładów</p><h1>Notatki są zapisane w bazie tej strony</h1></header>
  <div class="empty"><p>Przedmioty, wykłady i postępy w nauce trzymane są w bazie przypisanej do tej strony w Claude. Otwórz ją w Claude, będąc zalogowanym, a pojawią się tutaj.</p></div>`;
}
function viewError() {
  return `<header class="head"><p class="eyebrow">Atlas Wykładów</p><h1>Nie udało się wczytać notatek</h1></header>
  <div class="empty"><p>Połączenie z bazą strony zostało przerwane${S.err ? ` (${esc(S.err)})` : ''}. Odśwież stronę, żeby spróbować ponownie.</p></div>`;
}
function gone(msg) {
  return `<div class="empty"><p class="empty-title">${esc(msg)}</p><button class="btn" data-act="go-home">Wróć na pulpit</button></div>`;
}

function bar(good, mid, total) {
  const g = total ? good / total * 100 : 0, m = total ? mid / total * 100 : 0;
  return `<span class="bar" role="img" aria-label="Umiem ${good}, w trakcie ${mid}, wszystkich ${total}"><i class="b-good" style="width:${g}%"></i><i class="b-mid" style="width:${m}%"></i></span>`;
}
const statusChip = st => `<span class="chip c-${STATUS[st] ? st : 'nowe'}">${STATUS[st] || STATUS.nowe}</span>`;
const examCls = d => d <= 7 ? 'bad' : d <= 21 ? 'warn' : 'neutral';

/* ---------- pulpit ---------- */
function viewHome() {
  const subs = subjectsSorted();
  let h = `<header class="head"><p class="eyebrow">${dateLine()}</p><h1>Pulpit</h1></header>`;
  if (S.subjects.some(s => s.example) || S.notes.some(n => n.example)) h += exampleBanner();
  if (!subs.length) {
    return h + `<div class="empty"><p class="empty-title">Zacznij od przedmiotów</p><p class="muted">Dodaj przedmioty, których się uczysz. Potem każda prezentacja z wykładu zamieni się w notatki, fiszki i test, a trafi do właściwego przedmiotu jako kolejny wykład.</p>${canWrite() ? '<button class="btn primary" data-act="new-subject">Dodaj pierwszy przedmiot</button>' : ''}</div>` + howTo();
  }

  const st = cardStats(S.notes);
  const newToday = Math.min(st.freshOk, newLeft());
  const todo = st.due + newToday;
  const mins = Math.max(1, Math.round(todo * 9 / 60));
  if (st.total) h += `<section class="today" aria-label="Powtórka na dziś">
    <div>
      <p class="label">Na dziś</p>
      <p class="today-num">${!st.due && newToday ? `<span class="big">${newToday}</span>${plural(newToday, 'nowa fiszka', 'nowe fiszki', 'nowych fiszek')} do poznania` : `<span class="big">${st.due}</span>do powtórki${newToday ? ` <span class="muted">+ ${newToday} ${plural(newToday, 'nowa', 'nowe', 'nowych')}</span>` : ''}`}</p>
      <p class="muted small">${todo ? `Około ${mins} min. Najpierw to, co najłatwiej zapomnieć, potem nowe.` : st.fresh > st.freshOk && newLeft() ? 'Na dziś wszystko. Nowe fiszki pojawią się, gdy otworzysz kolejny wykład.' : st.total ? 'Na dziś wszystko powtórzone.' : 'Fiszki pojawią się razem z pierwszym wykładem.'}</p>
    </div>
    <div class="today-side">
      ${todo ? '<button class="btn primary" data-act="review" data-kind="all">Zacznij powtórkę</button>' : ''}
      ${activity()}
    </div>
  </section>`;
  h += eventsBlock();
  h += nextClassesBlock();
  if (!S.notes.length) h += howTo();

  h += `<section class="block"><div class="block-head"><h2 class="h2">Przedmioty</h2>${canWrite() ? '<button class="btn ghost sm" data-act="new-subject">+ Dodaj przedmiot</button>' : ''}</div>
    <div class="subj-grid">${subs.map(subjCard).join('')}</div></section>`;

  const recent = S.notes.slice().sort((a, b) => String(b.addedAt || '').localeCompare(String(a.addedAt || ''))).slice(0, 5);
  if (recent.length) {
    h += `<section class="block"><h2 class="h2">Ostatnio dodane</h2><ul class="recent">${recent.map(n => {
      const s = subjectById(n.subjectId);
      return `<li><button class="recent-row" data-act="go-note" data-id="${esc(n.id)}" style="${cvar(s && s.stain)}"><span class="sw"></span><span class="recent-title">${esc(n.title || 'Bez tytułu')}</span><span class="muted small">${esc(s ? s.name : 'bez przedmiotu')} · ${esc(unitN(n.subjectId, n.nr))}${n.addedAt ? ' · ' + esc(fmtIso(n.addedAt)) : ''}</span></button></li>`;
    }).join('')}</ul></section>`;
  }
  return S.notes.length ? h + howTo() : h;
}

function subjCard(s) {
  const ns = notesOf(s.id), c = statusCount(ns), cs = cardStats(ns);
  const next = upcoming(s.id)[0];
  const live = next && next.d === today() && next.s <= nowHM();
  const nextEv = overdueEvents(s.id).concat(upcomingEvents(s.id))[0];
  const exam = nextEv ? `${evTypeName(nextEv.type)} ${daysUntil(nextEv.date) < 0 ? 'po terminie' : inDays(daysUntil(nextEv.date))}`
    : live ? `Trwają zajęcia, do ${next.e || ''}`
    : next ? `Następne zajęcia: ${whenShort(next)}` : 'Brak terminów';
  return `<button class="subj-card" data-act="go-subject" data-id="${esc(s.id)}" style="${cvar(s.stain)}">
    <span class="subj-top"><span class="sw lg"></span>${s.example ? '<span class="tag-ex">przykład</span>' : ''}</span>
    <span class="subj-name">${esc(s.name)}</span>
    <span class="subj-meta">${pl(ns.length, ...unitOf(s.id).slice(1))}${cs.due ? ` · <b>${cs.due} do powtórki</b>` : ''}</span>
    ${bar(c.umiem, c.czytam, ns.length)}
    <span class="subj-foot">${esc(exam)}</span>
  </button>`;
}

function activity() {
  const t = today(), days = (S.stats && S.stats.days) || {};
  let cells = '', sum = 0;
  for (let i = 13; i >= 0; i--) {
    const d = addDays(t, -i), n = days[d] || 0;
    sum += n;
    const lv = n === 0 ? 0 : n < 10 ? 1 : n < 30 ? 2 : n < 60 ? 3 : 4;
    cells += `<i class="lv${lv}" title="${esc(fmtDay(d, {day: 'numeric', month: 'short'}))}: ${n}"></i>`;
  }
  let streak = 0;
  for (let i = days[t] ? 0 : 1; i < 400; i++) { if (days[addDays(t, -i)]) streak++; else break; }
  return `<div class="act"><div class="act-cells" aria-hidden="true">${cells}</div>
    <p class="muted small">Ostatnie 14 dni: ${pl(sum, 'powtórka', 'powtórki', 'powtórek')}${streak > 1 ? ` · seria ${streak} dni` : ''}</p></div>`;
}

function exampleBanner() {
  let actions = '';
  if (canWrite()) actions = S.confirmClear
    ? `<div class="row wrap"><button class="btn danger sm" data-act="clear-examples-yes">Tak, usuń przykłady</button><button class="btn ghost sm" data-act="clear-examples-no">Anuluj</button></div>`
    : `<button class="btn sm" data-act="clear-examples">Usuń przykłady</button>`;
  return `<div class="banner"><div><p class="banner-title">Przykładowe przedmioty i jeden wykład pokazowy</p>
    <p class="muted small">Pokazują, jak działa strona. Zmień nazwy na swoje przedmioty (przedmiot → Edytuj) albo usuń przykłady jednym kliknięciem. Przedmiot, który edytujesz, przestaje być przykładem.</p></div>${actions}</div>`;
}

function howTo() {
  const can = S.subjects.length && canWrite();
  return `<section class="block"><h2 class="h2">Jak dodać nowy wykład</h2><div class="howto">
    <div class="how"><h3>Wyślij prezentację w czacie</h3><p>Załącz plik .pptx lub .pdf w rozmowie z Claude i napisz, do którego przedmiotu. Notatki, fiszki i test dopiszą się tutaj same jako kolejny wykład.</p>${can ? '<button class="btn sm" data-act="open-import" data-tab="chat">Skopiuj gotowe polecenie</button>' : ''}</div>
    ${S.sample ? `<div class="how"><h3>Albo wgraj plik tutaj</h3><p>Claude przeczyta tekst slajdów prosto na tej stronie. Szybko, ale bez obrazów i schematów.</p>${can ? '<button class="btn sm" data-act="open-import" data-tab="file">Wgraj prezentację</button>' : ''}</div>` : ''}
    <div class="how"><h3>Ucz się aktywnie</h3><p>Czytaj w trybie przypominania, codziennie rób powtórkę fiszek z pulpitu, a przed egzaminem rozwiąż test z całego przedmiotu.</p></div>
  </div></section>`;
}

/* ---------- przedmiot ---------- */
function viewSubject(id) {
  const s = subjectById(id);
  if (!s) return gone('Ten przedmiot został usunięty.');
  const ns = notesOf(id), cs = cardStats(ns), c = statusCount(ns);
  const qn = ns.reduce((a, n) => a + arr(n.quiz).length, 0);
  const evs = allEvents().filter(e => e.subjectId === id);
  const nextEv = overdueEvents(id).concat(upcomingEvents(id))[0];
  const examLine = nextEv
    ? `<span>${esc(evTypeName(nextEv.type))} ${esc(fmtDay(nextEv.date))}</span>${evPill(nextEv)}`
    : '<span>brak terminów</span>';
  const sessionCount = cs.due + Math.min(cs.freshOk, newLeft());
  const up = upcoming(id), who = {};
  for (const x of planItems()) if (x.sid === id && x.who) (who[x.t] || (who[x.t] = new Set())).add(x.who);
  const whoLine = Object.entries(who).map(([t, set]) => `${esc(cap(TYPES[t] || t))}: ${[...set].map(esc).join(', ')}`).join(' · ');
  let h = `<header class="head" style="${cvar(s.stain)}">
    <p class="eyebrow"><span class="sw"></span>Przedmiot${s.example ? ' · przykład' : ''}</p>
    <h1>${esc(s.name)}</h1>
    <p class="head-meta"><span>${pl(ns.length, ...unitOf(id).slice(1))} · ${pl(cs.cards, 'fiszka', 'fiszki', 'fiszek')} · ${pl(qn, 'pytanie', 'pytania', 'pytań')} ·</span>${examLine}</p>
    ${whoLine ? `<p class="head-meta">${whoLine}</p>` : ''}
    <div class="actions">
      <button class="btn primary" data-act="review" data-kind="subject" data-id="${esc(id)}" ${cs.total ? '' : 'disabled'}>${sessionCount ? `Powtórka (${sessionCount})` : 'Przegląd fiszek'}</button>
      <button class="btn" data-act="quiz" data-kind="subject" data-id="${esc(id)}" ${qn ? '' : 'disabled'}>Test z przedmiotu</button>
      ${canWrite() ? `<details class="menu" data-k="add-menu"><summary class="btn">Dodaj…</summary><div class="menu-list">
        <button data-act="open-import" data-id="${esc(id)}">Wykład z prezentacji<span class="muted">notatki, fiszki i test od Claude'a</span></button>
        <button data-act="ed-new" data-id="${esc(id)}">Własną notatkę<span class="muted">piszesz sam albo sama</span></button>
        <button data-act="ev-new" data-id="${esc(id)}">Termin<span class="muted">kolokwium, egzamin, projekt…</span></button></div></details>
        <button class="btn ghost" data-act="edit-subject" data-id="${esc(id)}">Edytuj</button>` : ''}
    </div>
    ${ns.length ? `<div class="subj-prog">${bar(c.umiem, c.czytam, ns.length)}<span class="muted small">Umiesz ${c.umiem} z ${ns.length} · w trakcie ${c.czytam}${cs.total ? ` · opanowane ${Math.round(cs.known / cs.total * 100)}% materiału do powtórek` : ''}</span></div>` : ''}
  </header>`;
  if (!ns.length) {
    h += `<div class="empty"><p class="empty-title">Brak ${unitOf(id)[3]}</p><p class="muted">Wyślij prezentację Claude'owi w czacie albo wgraj ją tutaj. Każdy nowy wykład dopisze się na końcu listy z kolejnym numerem.</p>${canWrite() ? `<div class="row wrap"><button class="btn primary" data-act="open-import" data-id="${esc(id)}">Dodaj pierwszy wykład</button><button class="btn" data-act="ed-new" data-id="${esc(id)}">Napisz własną notatkę</button></div>` : ''}</div>`;
  } else {
    h += `<ol class="lectures" style="${cvar(s.stain)}">${ns.map(lecRow).join('')}</ol>`;
  }
  if (evs.length) {
    const t = today();
    const active = evs.filter(e => !e.done && (e.date >= t || evHasSteps(e))), rest = evs.filter(e => !active.includes(e));
    h += `<section class="subj-events"><div class="block-head"><h2 class="h2">Terminy</h2></div>
      ${active.length ? `<ul class="ev-list">${active.map(evRow).join('')}</ul>` : '<p class="muted" style="margin:0">Brak nadchodzących terminów.</p>'}
      ${rest.length ? `<details class="past-weeks" data-k="ev-past-${esc(id)}" ${S.openDetails.has('ev-past-' + id) ? 'open' : ''} style="margin-top:12px"><summary>Minione i zrobione (${rest.length})</summary><ul class="ev-list">${rest.slice().reverse().map(evRow).join('')}</ul></details>` : ''}</section>`;
  }
  if (up.length) {
    h += `<section class="subj-classes"><div class="block-head"><h2 class="h2">Najbliższe zajęcia</h2>${up.length > 5 ? `<span class="muted small">i jeszcze ${pl(up.length - 5, 'termin', 'terminy', 'terminów')} w planie</span>` : ''}</div>
      <ul class="cls-list">${up.slice(0, 5).map(x => classRow(x, {withDay: true, static: true})).join('')}</ul></section>`;
  }
  return h;
}
function lecRow(n) {
  const p = P(n.id), due = cardStats([n]).due;
  const meta = [];
  if (isYmd(n.lectureDate)) meta.push(esc(fmtDay(n.lectureDate)));
  meta.push(pl(arr(n.flashcards).length, 'fiszka', 'fiszki', 'fiszek'));
  meta.push(pl(arr(n.quiz).length, 'pytanie', 'pytania', 'pytań'));
  if (p.quiz) meta.push(`test ${p.quiz.last}%`);
  const toFix = Object.values(p.qz || {}).filter(h => h && h.ok === false).length;
  if (toFix) meta.push(`${toFix} do poprawy`);
  if (due) meta.push(`<b>${due} do powtórki</b>`);
  if (n.example) meta.push('przykład');
  if (n.own) meta.push('własna notatka');
  else if (n.myNotes) meta.push('z moimi notatkami');
  return `<li><button class="lec" data-act="go-note" data-id="${esc(n.id)}">
    <span class="lec-nr">${pad2(Number(n.nr) || 0)}</span>
    <span class="lec-main"><span class="lec-title">${esc(n.title || 'Bez tytułu')}</span><span class="lec-meta">${meta.join(' · ')}</span></span>
    ${statusChip(statusOf(n.id))}
  </button></li>`;
}

/* ---------- wykład ---------- */
function viewNote(id) {
  const n = noteById(id);
  if (!n) return gone('Ten wykład został usunięty.');
  const s = subjectById(n.subjectId);
  const ns = s ? notesOf(s.id) : [n];
  const idx = ns.findIndex(x => x.id === id);
  const prev = ns[idx - 1], next = ns[idx + 1];
  const st = statusOf(id), p = P(id), cards = cardsOf(n), qs = arr(n.quiz), revN = itemsOf(n).filter(c => c.kind !== 'mcq').length;
  const secs = noteSections(n);
  if (n.myNotes || (canWrite() && !n.own)) {
    let at = secs.findIndex(x => x.id === 's-exam');
    if (at < 0) at = secs.findIndex(x => x.id === 's-hy');
    if (at < 0) at = secs.findIndex(x => x.id === 's-sum');
    secs.splice(at + 1, 0, {id: 's-my', t: 'Moje notatki', cls: 'mine',
      tool: canWrite() ? `<button class="tool" data-act="my-open" data-id="${esc(id)}">${n.myNotes ? 'Edytuj' : 'Dodaj'}</button>` : '',
      html: n.myNotes ? `<div class="md">${md(n.myNotes)}</div>` : '<p class="muted" style="margin:0;font-family:var(--f-ui);font-size:14.5px">Dopisz własne uwagi, przykłady z zajęć albo to, co prowadzący mówił poza slajdami.</p>'});
  }
  if (cards.length) secs.push({id: 's-fc', t: `Fiszki (${cards.length})`, html: inlineCards(n, cards)});
  if (qs.length) secs.push({id: 's-qz', t: `Sprawdź się · ${pl(qs.length, 'pytanie', 'pytania', 'pytań')}`, html: `<div class="qz-teaser"><p>${p.quiz ? `Ostatni wynik: <b>${p.quiz.last}%</b> · najlepszy: ${p.quiz.best}%` : 'Ten test nie był jeszcze rozwiązywany.'}</p><button class="btn primary sm" data-act="quiz" data-kind="note" data-id="${esc(id)}">Rozwiąż test</button></div>`});
  const hasCards = cards.length || arr(n.vocab).length;   // słówka same są fiszkami
  if ((!hasCards || !qs.length) && S.sample && canWrite()) {
    const what = !hasCards && !qs.length ? 'fiszek ani testu' : !hasCards ? 'fiszek' : 'testu';
    secs.push({id: 's-gen', t: 'Fiszki i test', html: `<div class="gen-box"><p>${S.genBusy === id ? 'Claude tworzy fiszki i pytania…' : `Ten wykład nie ma jeszcze ${what}.`}</p><button class="btn primary sm" data-act="gen-tools" data-id="${esc(id)}" ${S.genBusy ? 'disabled' : ''}>${S.genBusy === id ? 'Tworzę…' : 'Wygeneruj z treści notatek'}</button></div>`});
  }

  const rec = S.recall;
  const meta = [];
  if (isYmd(n.lectureDate)) meta.push(`wykład z ${esc(fmtDay(n.lectureDate, {day: 'numeric', month: 'long', year: 'numeric'}))}`);
  if (n.addedAt) meta.push(`dodano ${esc(fmtIso(n.addedAt))}`);
  if (n.editedAt) meta.push(`edytowano ${esc(fmtIso(n.editedAt))}`);
  if (n.source && !n.own) meta.push(`źródło: ${esc(n.source)}`);

  let h = `<header class="head" style="${cvar(s && s.stain)}">
    <nav class="crumbs" aria-label="Ścieżka">${s ? `<button class="crumb" data-act="go-subject" data-id="${esc(s.id)}"><span class="sw"></span>${esc(s.name)}</button><span aria-hidden="true">/</span>` : ''}<span>${esc(unitN(n.subjectId, n.nr))}</span>${n.example ? '<span class="tag-ex">przykład</span>' : ''}${n.own ? '<span class="tag-own">własna notatka</span>' : ''}</nav>
    <h1>${esc(n.title || 'Bez tytułu')}</h1>
    ${meta.length ? `<p class="head-meta">${cap(meta.join(' · '))}</p>` : ''}
    <div class="note-bar">
      <div class="seg" role="group" aria-label="Jak dobrze znasz ten wykład">${['nowe', 'czytam', 'umiem'].map(k => `<button class="seg-b ${st === k ? 'on' : ''}" data-act="set-status" data-val="${k}" aria-pressed="${st === k}">${STATUS[k]}</button>`).join('')}</div>
      <div class="row wrap">
        <button class="btn sm ${rec ? 'on' : ''}" data-act="toggle-recall" aria-pressed="${rec}">${rec ? 'Odsłoń wszystko' : 'Tryb przypominania'}</button>
        <button class="btn sm" data-act="font-size" title="Wielkość tekstu" aria-label="Zmień wielkość tekstu notatki">Aa</button>
        ${revN ? `<button class="btn sm" data-act="review" data-kind="note" data-id="${esc(id)}">Fiszki</button>` : ''}
        ${qs.length ? `<button class="btn sm" data-act="quiz" data-kind="note" data-id="${esc(id)}">Test</button>` : ''}
        ${S.sample ? `<button class="btn sm" data-act="ask-open" data-id="${esc(id)}">Zapytaj Claude'a</button>` : ''}
        ${canWrite() ? `<button class="btn sm" data-act="ed-open" data-id="${esc(id)}">Edytuj</button>` : ''}
      </div>
    </div>
    ${rec ? '<p class="recall-hint">Szare pola to luki. Najpierw spróbuj sobie przypomnieć, co tam jest, potem kliknij, żeby sprawdzić.</p>' : ''}
  </header>
  ${(() => { const rp = readPos(id), sx = rp && rp.i >= 2 && rp.i < secs.length - 1 && secs.find(x => x.id === rp.id); return sx ? `<button class="resume" data-act="toc" data-id="${sx.id}">Czytaj dalej: <b>${esc(sx.t)}</b><span aria-hidden="true">↓</span></button>` : ''; })()}
  <div class="read-bar"><label class="sr" for="toc-sel">Przejdź do części</label><select id="toc-sel"><option value="">Przejdź do części…</option>${secs.map(x => `<option value="${x.id}">${esc(x.t)}</option>`).join('')}</select><div class="read-prog" aria-hidden="true"><i id="read-i"></i></div></div>
  <div class="note-grid">
    <article class="note ${rec ? 'recall' : ''}" data-fs="${noteFs}">${secs.map(x => {
      const body = x.html;
      const title = `<h2 class="nsec-t ${x.h ? 'h' : ''}">${esc(x.t)}</h2>`;
      return `<section class="nsec ${x.cls || ''}" id="${x.id}">${x.tool ? `<div class="nsec-tools">${title}${x.tool}</div>` : title}${body}</section>`;
    }).join('')}</article>
    <aside class="toc" aria-label="Spis treści"><p class="label">Spis treści</p>${secs.map(x => `<button class="toc-i" data-act="toc" data-id="${x.id}">${esc(x.t)}</button>`).join('')}</aside>
  </div>
  ${prev || next ? `<nav class="pn" aria-label="Sąsiednie wykłady">${prev ? `<button class="pn-b" data-act="go-note" data-id="${esc(prev.id)}"><span class="label">← ${esc(unitN(n.subjectId, prev.nr))}</span><span>${esc(prev.title)}</span></button>` : '<span></span>'}${next ? `<button class="pn-b r" data-act="go-note" data-id="${esc(next.id)}"><span class="label">${esc(unitN(n.subjectId, next.nr))} →</span><span>${esc(next.title)}</span></button>` : '<span></span>'}</nav>` : ''}
  ${canWrite() ? manageNote(n, idx, ns) : ''}`;
  return h;
}
function deadlineEvent(n, d) {
  const t = String(d.title || '').trim().toLowerCase();
  return S.events.find(e => e.subjectId === n.subjectId && (String(e.title || '').trim().toLowerCase() === t || (d.date && e.date === d.date && e.type === d.type)));
}
function examSection(n) {
  const info = arr(n.examInfo).map(x => typeof x === 'string' ? {text: x} : x).filter(x => x && x.text);
  const dl = arr(n.deadlines).filter(d => d && d.title);
  if (!info.length && !dl.length) return null;
  const rows = dl.map((d, i) => {
    const have = deadlineEvent(n, d), type = EV_TYPES[d.type] || 'Termin';
    const btn = have ? '<span class="pill good">w kalendarzu</span>' : canWrite() ? `<button class="btn sm" data-act="dl-add" data-id="${esc(n.id)}" data-i="${i}">${d.date ? 'Dodaj do kalendarza' : 'Ustal datę i dodaj'}</button>` : '';
    const label = d.title.toLowerCase().startsWith(type.toLowerCase()) ? d.title : `${type}: ${d.title}`;
    return `<p class="dl"><b>${esc(label)}</b>${d.date ? `<span>${esc(fmtDay(d.date, {day: 'numeric', month: 'long'}))}</span>` : ''}${d.scope ? `<span class="muted">${esc(d.scope)}</span>` : ''}${btn}</p>`;
  }).join('');
  return {id: 's-exam', t: 'Prowadzący mówi', cls: 'exam', html: rows + (info.length ? `<ul class="dot-list">${info.map(x => `<li>${mdi(x.text)}${x.src ? ` <span class="src">${esc(x.src)}</span>` : ''}</li>`).join('')}</ul>` : '')};
}
function noteSections(n) {
  const secs = [];
  if (n.summary) secs.push({id: 's-sum', t: 'W skrócie', html: `<div class="md lead">${md(n.summary)}</div>`});
  if (arr(n.highYield).length) secs.push({id: 's-hy', t: 'Najważniejsze na egzamin', html: `<ul class="hy-list">${arr(n.highYield).map(x => `<li>${mdi(x)}</li>`).join('')}</ul>`});
  const ex = examSection(n);
  if (ex) secs.push(ex);
  const quotes = arr(n.terms).filter(t => t && t.quote);
  if (quotes.length) secs.push({id: 's-def', t: 'Definicje na pamięć', html: quotes.map(t => `<figure class="quote"><figcaption>${mdi(t.term)}</figcaption><blockquote class="md">${mdi(t.quote)}</blockquote>${t.source ? `<p class="src">${esc(t.source)}</p>` : ''}</figure>`).join('')});

function applyRecall(root) {

/* ---------- wyszukiwanie ---------- */
function viewSearch() {
  const q = S.q.trim(), fq = fold(q);
  let h = `<header class="head"><p class="eyebrow">Wyszukiwanie</p><h1>„${esc(q)}”</h1></header>`;
  if (q.length < 2) return h + '<p class="muted">Wpisz co najmniej dwa znaki.</p>';
  const res = [];
  for (const n of S.notes) {
    const fields = [['Tytuł', n.title], ['W skrócie', n.summary]]
      .concat(arr(n.highYield).map(x => ['Najważniejsze', x]))
      .concat(arr(n.sections).map(x => [(x && x.heading) || 'Notatki', ((x && x.heading) || '') + ' — ' + ((x && x.body) || '')]))
      .concat(arr(n.terms).map(x => ['Pojęcia', `${x && x.term} — ${x && x.def}`]))
      .concat(practiceOf(n).map(x => ['W praktyce', x]))
      .concat(arr(n.flashcards).map(x => ['Fiszka', `${x && x.q} — ${x && x.a}`]))
      .concat(n.myNotes ? [['Moje notatki', n.myNotes]] : [])
      .concat(arr(n.mnemonics).map(x => ['Mnemotechniki', x]))
      .concat(arr(n.examInfo).map(x => ['Prowadzący mówi', typeof x === 'string' ? x : x && x.text]))
      .concat(arr(n.vocab).map(v => ['Słownictwo', v && `${v.w} — ${v.pl}`]))
      .concat(arr(n.people).map(x => ['Kto jest kim', x && `${x.name} — ${x.idea || ''}`]))
      .concat(arr(n.examQuestions).map(q => ['Pytania egzaminacyjne', q && q.q]))
      .concat(arr(n.tags).map(x => ['Tag', x]));
    let hits = 0, first = null;
    for (const [label, raw] of fields) {
      const txt = plain(raw), f = fold(txt);
      let i = f.indexOf(fq);
      if (i >= 0 && !first) first = {label, txt, i};
      while (i >= 0) { hits++; i = f.indexOf(fq, i + fq.length); }
    }
    if (hits) res.push({n, hits, first, titleHit: fold(n.title || '').includes(fq) ? 1 : 0});
  }
  res.sort((a, b) => (b.titleHit - a.titleHit) || (b.hits - a.hits));
  if (!res.length) return h + '<p class="muted">Nic nie znaleziono. Spróbuj innego słowa albo krótszej frazy.</p>';
  h += `<p class="muted" style="margin:0 0 12px">${pl(res.length, 'wykład', 'wykłady', 'wykładów')}</p><ul class="results">`;
  for (const r of res) {
    const s = subjectById(r.n.subjectId), f = r.first;
    const a = Math.max(0, f.i - 70), b = Math.min(f.txt.length, f.i + fq.length + 90);
    const snip = (a > 0 ? '…' : '') + esc(f.txt.slice(a, f.i)) + '<mark>' + esc(f.txt.slice(f.i, f.i + fq.length)) + '</mark>' + esc(f.txt.slice(f.i + fq.length, b)) + (b < f.txt.length ? '…' : '');
    h += `<li><button class="res" data-act="go-note" data-id="${esc(r.n.id)}" style="${cvar(s && s.stain)}">
      <span class="res-src"><span class="sw"></span>${esc(s ? s.name : '')} · ${esc(unitN(r.n.subjectId, r.n.nr))} · ${pl(r.hits, 'trafienie', 'trafienia', 'trafień')}</span>
      <span class="res-title">${esc(r.n.title)}</span><span class="res-snip">${esc(f.label || '')}: ${snip}</span></button></li>`;
  }
  return h + '</ul>';
}

function dbErr(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Baza strony jest pełna. Usuń stare wykłady, żeby zrobić miejsce.';
  if (c === 'invalid_argument') return 'Nie masz uprawnień do zmian na tej stronie albo dane są nieprawidłowe.';
  if (c === 'resource_exhausted') return 'Za dużo zapisów naraz. Spróbuj za chwilę.';
  return 'Nie udało się zapisać. Spróbuj ponownie.';
}
let tt = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(tt);
  tt = setTimeout(() => { t.hidden = true; }, 3400);
}
async function renumber(list) {
  for (let k = 0; k < list.length; k++) {
    if (Number(list[k].nr) !== k + 1) await S.db.doc('notes/' + list[k].id).update({nr: k + 1});
  }
}
async function moveNote(id, dir) {
  const n = noteById(id);
  if (!n) return;
  const ns = notesOf(n.subjectId), i = ns.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= ns.length) return;
  [ns[i], ns[j]] = [ns[j], ns[i]];
  try { await renumber(ns); toast(`Teraz to ${unitN(n.subjectId, j + 1)}`); } catch (e) { toast(dbErr(e)); }
}
async function transferNote(id, sid) {
  const n = noteById(id), s = subjectById(sid);
  if (!n || !s || n.subjectId === sid) return;
  const oldList = notesOf(n.subjectId).filter(x => x.id !== id);
  const nr = nextNr(sid);
  try {
    await S.db.doc('notes/' + id).update({subjectId: sid, nr});
    await renumber(oldList);
    await unlinkLecture(id);
    toast(`Przeniesiono do: ${s.name} (${unitN(s.id, nr)})`);
  } catch (e) { toast(dbErr(e)); }
}
async function deleteNote(id) {
  const n = noteById(id);
  if (!n) return;
  const sid = n.subjectId, rest = notesOf(sid).filter(x => x.id !== id);
  try {
    await S.db.doc('notes/' + id).delete();
    if (n.hasBackup) await S.db.doc('noteBackups/' + id).delete();
    await unlinkLecture(id);
    await renumber(rest);
    toast('Usunięto wykład.');
    go(subjectById(sid) ? {name: 'subject', id: sid} : {name: 'home'});
  } catch (e) { toast(dbErr(e)); }
}
async function deleteSubject(id) {
  const ns = notesOf(id);
  const items = arr(S.plan && S.plan.items);
  try {
    for (const n of ns) {
      await S.db.doc('notes/' + n.id).delete();
      if (n.hasBackup) await S.db.doc('noteBackups/' + n.id).delete();
    }
    for (const e of S.events.filter(x => x.subjectId === id)) await S.db.doc('events/' + e.id).delete();
    if (items.some(x => x && x.sid === id)) await S.db.doc('meta/plan').update({items: items.filter(x => !x || x.sid !== id)});
    await S.db.doc('subjects/' + id).delete();
    closeOv();
    go({name: 'home'});
    toast('Usunięto przedmiot.');
  } catch (e) { toast(dbErr(e)); }
}
async function clearExamples() {
  S.confirmClear = false;
  const exNotes = S.notes.filter(n => n.example);
  const keep = new Set(S.notes.filter(n => !n.example).map(n => n.subjectId));
  const exSubs = S.subjects.filter(s => s.example);
  try {
    for (const n of exNotes) await S.db.doc('notes/' + n.id).delete();
    for (const s of exSubs) {
      if (keep.has(s.id)) await S.db.doc('subjects/' + s.id).update({example: false});
      else await S.db.doc('subjects/' + s.id).delete();
    }
    toast('Usunięto przykłady.');
    go({name: 'home'});
  } catch (e) { toast(dbErr(e)); }
}

let ovT = 0;
function openOv() {
  const el = $('#ov');
  el.hidden = false;
  document.body.classList.add('locked');
  if (motion()) { el.classList.add('enter'); clearTimeout(ovT); ovT = setTimeout(() => el.classList.remove('enter'), 340); }
  renderOv();
}
function closeOv() {
  if (S.ov && S.ov.ctl) { try { S.ov.ctl.abort(); } catch (e) {} }
  S.ov = null;
  const el = $('#ov');
  if (motion() && !el.hidden && el.firstChild) {
    // stara nakładka odjeżdża jako kopia, a pod spodem od razu działa nowy, pusty #ov
    const fresh = el.cloneNode(false);
    el.removeAttribute('id');
    el.classList.remove('enter');
    el.classList.add('ov-ghost');
    el.setAttribute('aria-hidden', 'true');
    el.inert = true;
    el.after(fresh);
    fresh.classList.remove('enter');
    clearTimeout(ovT);
    fresh.hidden = true;
    setTimeout(() => el.remove(), 240);
  } else {
    el.hidden = true;
    el.innerHTML = '';
  }
  document.body.classList.remove('locked');
  render();
}
function renderOv() {
  const o = S.ov;
  if (!o) return;
  const anim = motion() ? o.anim || '' : '';
  o.anim = null;
  const locked = (o.type === 'import' && (o.stage === 'gen' || o.stage === 'extract')) || (o.type === 'ask' && o.busy) || ((o.type === 'editor' || o.type === 'mynotes') && !!o.busy);
  const body = o.type === 'review' ? ovReview(o) : o.type === 'quiz' ? ovQuiz(o) : o.type === 'import' ? ovImport(o) : o.type === 'subject' ? ovSubject(o) : o.type === 'event' ? ovEvent(o) : o.type === 'day' ? ovDay(o) : o.type === 'editor' ? ovEditor(o) : o.type === 'mynotes' ? ovMyNotes(o) : ovAsk(o);
  const el = $('#ov');
  // przy ponownym rysowaniu tej samej nakładki zostajemy w tym samym miejscu i przy tym samym polu
  const prev = el.querySelector('.panel'), same = el.__ov === o && prev;
  const top = same ? prev.scrollTop : 0;
  const act = document.activeElement;
  const fk = same && act && prev.contains(act) ? (act.id ? '#' + act.id : act.dataset && act.dataset.ck != null ? `[data-ck="${act.dataset.ck}"]` : null) : null;
  el.innerHTML = `<div class="ov-scrim" ${locked ? '' : 'data-act="close-ov"'}></div><div class="panel panel-${o.type}${anim ? ' a-' + anim : ''}" role="dialog" aria-modal="true" tabindex="-1">${body}</div>`;
  el.__ov = o;
  const panel = el.querySelector('.panel');
  if (top) panel.scrollTop = top;
  const af = (fk && el.querySelector(fk)) || el.querySelector('[autofocus]') || panel;
  if (af) af.focus({preventScroll: true});
  if (anim === 'done') {
    panel.querySelectorAll('[data-count]').forEach(countUp);
    if (o.party) { o.party = false; confetti(); }
  }
}

function scopeLabel(kind, id, what) {
  if (kind === 'subject') { const s = subjectById(id); return `${what} · ${s ? s.name : ''}`; }
  if (kind === 'note') { const n = noteById(id); return `${what}${n ? ' · ' + unitN(n.subjectId, n.nr) : ''}`; }
  if (kind === 'event') { const e = eventById(id); return `${what} · ${e ? evTitle(e) : ''}`; }
  return `${what} · wszystkie przedmioty`;
}

/* ---------- powtórka: fiszki, luki, pojęcia, błędy z testów ---------- */
const KIND_TAG = {cloze: 'luka', term: 'pojęcie od tyłu', mcq: 'błąd z testu', vocab: 'słówko', person: 'osoba'};
function startReview(kind, id) {
  const notes = scopeNotes(kind, id), t = today();
  const due = [], fresh = [];
  for (const n of notes) {
    const opened = kind === 'note' || kind === 'event' || statusOf(n.id) !== 'nowe';
    for (const c of itemsOf(n)) {
      const st = cardSt(c);
      if (st && st.sus) continue;
      if (!st) { if (opened && c.kind !== 'mcq') fresh.push(c); }
      else if (st.d <= t) due.push(c);
    }
  }
  due.sort((x, y) => retrievability(cardSt(x)) - retrievability(cardSt(y)));
  // nowe: najpierw przedmioty z najbliższym terminem, potem w kolejności wykładów
  const exam = c => { const n = noteById(c.noteId); return (n && examDateFor(n.subjectId)) || '9999'; };
  const nr = c => Number((noteById(c.noteId) || {}).nr) || 0;
  const freshSorted = fresh.map((c, i) => [c, i]).sort((x, y) => exam(x[0]).localeCompare(exam(y[0])) || nr(x[0]) - nr(y[0]) || x[1] - y[1]).map(x => x[0]);
  const cap = kind === 'note' || kind === 'event' ? freshSorted.length : newLeft();
  let q = due.concat(freshSorted.slice(0, cap));
  let cram = false;
  if (!q.length && kind !== 'all') {
    q = shuffle(notes.flatMap(itemsOf).filter(c => c.kind !== 'mcq' && !(cardSt(c) || {}).sus)).slice(0, 50);
    cram = true;
  }
  if (!q.length) {
    const st = cardStats(notes);
    toast(st.fresh > st.freshOk ? 'Na dziś wszystko. Nowe fiszki pojawią się po otwarciu kolejnego wykładu.' : !newLeft() && st.fresh ? 'Na dziś wszystko. Kolejne nowe fiszki jutro.' : 'Na dziś wszystko powtórzone.');
    return;
  }
  S.ov = {type: 'review', kind, id, q, i: 0, flipped: false, mcq: null, tally: {1: 0, 2: 0, 3: 0, 4: 0}, cram, label: scopeLabel(kind, id, cram ? 'Przegląd' : 'Powtórka')};
  openOv();
}
function flipCard() {
  const o = S.ov;
  if (!o || o.type !== 'review' || o.flipped) return;
  o.flipped = true;
  o.anim = 'flip';
  renderOv();
}
function rate(g) {
  const o = S.ov, c = o && o.q[o.i];
  if (!c) return;
  const gh = ghostOf($('#ov .panel-review .card'), g === 1 ? 'out-left' : g === 2 ? 'out-down' : 'out-right');
  const p = clone(P(c.noteId));
  if (!p.cards) p.cards = {};
  const prev = p.cards[c.key], n = noteById(c.noteId);
  if (o.cram && !prev) {
    bumpStats(false);   // przegląd: nowa fiszka nie trafia do harmonogramu ani do dziennego limitu
  } else {
    p.cards[c.key] = schedule(prev, g, n && examDateFor(n.subjectId));
    S.prog[c.noteId] = p;
    saveProg(c.noteId);
    bumpStats(!prev);
  }
  if (g === 1) o.q.splice(Math.min(o.i + 4, o.q.length), 0, {...c, order: null});
  o.tally[g]++;
  o.i++;
  o.flipped = false;
  o.mcq = null;
  o.anim = o.i >= o.q.length ? 'done' : 'next';
  if (o.i >= o.q.length && o.q.length >= 5) o.party = true;   // nagroda za skończoną sesję, nie za jedną kartę
  renderOv();
  if (gh) $('#ov').appendChild(gh);
}
const whenLabel = d => d <= 0 ? 'jeszcze dziś' : d === 1 ? 'jutro' : `za ${d} dni`;
function ovReview(o) {
  const total = o.q.length;
  if (o.i >= total) {
    const T = o.tally, n = T[1] + T[2] + T[3] + T[4];
    return ovHeadLabel(o.label) + `<div class="done"><p class="done-big">Gotowe</p>
      <p>${pl(n, 'odpowiedź', 'odpowiedzi', 'odpowiedzi')}: łatwe ${T[4]}, dobrze ${T[3]}, z trudem ${T[2]}, nie pamiętam ${T[1]}.</p>
      <p class="muted">Każda fiszka wróci wtedy, gdy zaczniesz ją zapominać. Trudne szybciej, łatwe rzadziej, a wszystkie przed najbliższym sprawdzianem z kalendarza.</p>
      <div class="row"><button class="btn primary" data-act="close-ov" autofocus>Zamknij</button></div></div>`;
  }
  const c = o.q[o.i], n = noteById(c.noteId), s = n && subjectById(n.subjectId);
  const st = cardSt(c);
  const tags = [];
  if (KIND_TAG[c.kind]) tags.push(`<span class="card-tag">${KIND_TAG[c.kind]}</span>`);
  if (!st) tags.push('<span class="card-tag">nowa</span>');
  if (st && st.leech) tags.push('<span class="card-tag hard">trudna</span>');
  let h = ovHeadLabel(o.label, `<span class="muted small tnum">${o.i + 1} / ${total}</span>`) +
    `<div class="prog"><i style="width:${o.i / total * 100}%"></i></div>
    <div class="card${o.flipped && c.kind !== 'mcq' ? ' swipe' : ''}" style="${cvar(s && s.stain)}"${!o.flipped && c.kind !== 'mcq' ? ' data-act="flip"' : ''}>
      ${o.flipped && c.kind !== 'mcq' ? '<span class="swipe-tag bad" aria-hidden="true">Nie pamiętam</span><span class="swipe-tag good" aria-hidden="true">Dobrze</span>' : ''}
      <p class="card-src"><span class="sw"></span>${esc(s ? s.name : '')}${n ? ' · ' + esc(unitN(n.subjectId, n.nr)) : ''} ${tags.join(' ')}</p>
      <div class="card-q">${mdi(c.q)}</div>`;
  if (c.kind === 'mcq') {
    const q = c.quiz, ans = Number(q.answer);
    if (!c.order) c.order = shuffle(arr(q.options).map((_, i) => i));
    const done = o.mcq !== null;
    h += `<div class="qz-opts">${c.order.map((k, j) => {
      const cls = !done ? '' : k === ans ? 'ok' : k === o.mcq ? 'no' : 'dim';
      return `<button class="qz-o ${cls}" data-act="rv-mcq" data-k="${k}" ${done ? 'disabled' : ''}><span class="qz-l">${'ABCDEF'[j]}</span><span>${mdi(q.options[k])}</span></button>`;
    }).join('')}</div>`;
    if (done) h += `<div class="qz-why"><p><b>${o.mcq === ans ? 'Dobrze.' : 'Jeszcze nie.'}</b> ${mdi(q.why || '')}</p></div>`;
    h += `</div><div class="rate">${done ? `<button class="btn primary wide" data-act="rv-mcq-next" autofocus>Dalej <span class="kbd">Enter</span></button>` : ''}</div>`;
    return h;
  }
  h += `${o.flipped ? `<div class="card-a">${mdi(c.a)}</div>` : ''}</div>`;
  if (!o.flipped) return h + `<div class="rate"><button class="btn primary wide" data-act="flip" autofocus>Pokaż odpowiedź <span class="kbd">spacja</span></button></div>`;
  const ex = n && examDateFor(n.subjectId);
  const days = [1, 2, 3, 4].map(g => daysBetween(today(), schedule(st, g, ex).d));
  const names = ['Nie pamiętam', 'Z trudem', 'Dobrze', 'Łatwe'];
  return h + `<div class="rate four">${[1, 2, 3, 4].map(g => `<button class="btn rate-b r${g}" data-act="rate" data-r="${g}"><b>${names[g - 1]}</b><span>${whenLabel(days[g - 1])}<span class="key"> · ${g}</span></span></button>`).join('')}</div><p class="swipe-hint">Przesuń kartę w prawo: Dobrze, w lewo: Nie pamiętam</p>`;
}

/* ---------- test ---------- */
function startQuiz(kind, id, only) {
  const notes = scopeNotes(kind, id);
  let qs = notes.flatMap(n => arr(n.quiz).filter(q => q && q.q && arr(q.options).length > 1).map(q => ({...q, noteId: n.id, key: qkey(q)})));
  if (only) qs = qs.filter(q => only.has(q.noteId + '|' + q.key));
  if (!qs.length) { toast('Brak pytań testowych w tych notatkach.'); return; }
  if (kind !== 'note' && !only) {
    // najpierw pytania z błędem przy ostatniej próbie, potem jeszcze nierozwiązywane
    const rank = q => { const h = ((S.prog[q.noteId] || {}).qz || {})[q.key]; return !h ? 1 : h.ok === false ? 0 : 2; };
    qs = shuffle(qs).sort((x, y) => rank(x) - rank(y)).slice(0, 25);
  }
  qs = shuffle(qs).map(q => ({...q, order: shuffle(arr(q.options).map((_, i) => i))}));
  S.ov = {type: 'quiz', kind, id, qs, only: !!only, i: 0, picked: null, correct: 0, per: {}, wrong: [], more: null, label: scopeLabel(kind, id, only ? 'Poprawa błędów' : 'Test')};
  openOv();
}
function recordAnswer(noteId, q, ok) {
  const p = clone(P(noteId)), key = qkey(q), n = noteById(noteId);
  if (!p.qz) p.qz = {};
  const h = p.qz[key] || {n: 0, w: 0};
  p.qz[key] = {n: h.n + 1, w: h.w + (ok ? 0 : 1), ok, at: today()};
  // błędna odpowiedź wraca w codziennej powtórce jako pytanie testowe
  if (!p.cards) p.cards = {};
  const mk = 'q:' + key;
  if (!ok) p.cards[mk] = schedule(p.cards[mk], 1, n && examDateFor(n.subjectId));
  else if (p.cards[mk]) p.cards[mk] = schedule(p.cards[mk], 3, n && examDateFor(n.subjectId));
  S.prog[noteId] = p;
  saveProg(noteId);
}
function pick(k) {
  const o = S.ov;
  if (!o || o.picked !== null) return;
  const q = o.qs[o.i], ok = k === Number(q.answer);
  o.picked = k;
  if (ok) o.correct++; else o.wrong.push(q);
  const r = o.per[q.noteId] || (o.per[q.noteId] = {c: 0, t: 0});
  r.t++;
  if (ok) r.c++;
  recordAnswer(q.noteId, q, ok);
  o.anim = 'pick';
  renderOv();
}
function quizNext() {
  const o = S.ov;
  if (!o || o.picked === null) return;
  if (o.moreCtl) o.moreCtl.abort();
  o.i++;
  o.picked = null;
  o.more = null;
  if (o.i >= o.qs.length) {
    for (const [nid, r] of Object.entries(o.per)) {
      const n = noteById(nid);
      // wynik wykładu zapisujemy tylko po teście z całego wykładu (nie po „Powtórz błędne” ani próbce z przedmiotu)
      if (o.only || !n || r.t < arr(n.quiz).filter(q => q && q.q && arr(q.options).length > 1).length) continue;
      const p = clone(P(nid)), pct = Math.round(r.c / r.t * 100);
      p.quiz = {last: pct, best: Math.max(pct, (p.quiz && p.quiz.best) || 0), at: today()};
      S.prog[nid] = p;
      saveProg(nid);
    }
  }
  if (o.i >= o.qs.length) {
    o.anim = 'done';
    o.party = o.qs.length >= 5 && o.correct / o.qs.length >= .85;
  } else o.anim = 'next';
  renderOv();
}
async function explainMore() {
  const o = S.ov;
  if (!o || o.type !== 'quiz' || o.moreBusy || !S.sample || o.picked === null) return;
  const q = o.qs[o.i], n = noteById(q.noteId), s = n && subjectById(n.subjectId), L = 'ABCDEF';
  const letter = k => L[q.order.indexOf(k)];
  const opts = q.order.map((k, j) => `${L[j]}) ${q.options[k]}`).join('\n');
  const prompt = `Student rozwiązywał test z przedmiotu ${s ? s.name : ''} i wybrał złą odpowiedź.
PYTANIE: ${q.q}
ODPOWIEDZI:
${opts}
WYBRAŁ: ${letter(o.picked)}) ${q.options[o.picked]}
POPRAWNA: ${letter(Number(q.answer))}) ${q.options[Number(q.answer)]}
WYJAŚNIENIE Z NOTATEK: ${q.why || 'brak'}
FRAGMENT NOTATEK:
${n ? noteText(n).slice(0, 3000) : ''}

Napisz po polsku w Markdown, najwyżej 120 słów: 1) dlaczego wybrana odpowiedź kusi, ale jest błędna; 2) kluczowe rozróżnienie między nią a poprawną (pogrubione); 3) jedno zdanie-haczyk do zapamiętania. Ostatnia linia dokładnie w formacie: FISZKA: pytanie || odpowiedź`;
  const ctl = new AbortController(), qi = o.i;
  o.moreBusy = true; o.moreCtl = ctl; o.more = {qi, text: ''};
  renderOv();
  const strip = t => t.replace(/\n?FISZKA:[\s\S]*$/, '').trim();
  try {
    const {text} = await S.sample(prompt, {modelTier: 'quick', signal: ctl.signal, onText: ({text: t}) => { const el = $('#qz-more-text'); if (el) el.innerHTML = md(strip(t)); }});
    if (S.ov !== o || o.i !== qi) return;
    const m = text.match(/FISZKA:\s*(.+?)\s*\|\|\s*(.+?)\s*$/);
    o.more = {qi, text: strip(text), card: m ? {q: m[1], a: m[2]} : null};
  } catch (e) {
    if (S.ov === o && o.i === qi && !(e && e.code === 'cancelled')) o.more = {qi, text: '', err: sampleErr(e)};
  } finally {
    if (S.ov === o) { o.moreBusy = false; o.moreCtl = null; renderOv(); }
  }
}

    return ovHeadLabel(o.label) + `<div class="done"><p class="done-big" data-count="${pct}" data-suffix="%">${pct}%</p><p>${o.correct} z ${o.qs.length} poprawnie.</p><p class="muted">${verdict}</p>
      ${o.wrong.length ? `<div class="wrong"><p class="label">Do poprawki</p><ul>${o.wrong.map(w => `<li>${mdi(w.q)}<br><span class="muted">Poprawna odpowiedź: ${mdi(arr(w.options)[w.answer])}</span></li>`).join('')}</ul></div>` : ''}

      ${m.card && canWrite() ? `<div class="row wrap"><span class="muted small">Fiszka z tego błędu: ${mdi(m.card.q)}</span>${m.added ? '<span class="pill good">dodana</span>' : '<button class="btn sm" data-act="quiz-add-card">Dodaj fiszkę</button>'}</div>` : ''}</div>`;

      ${o.kind !== 'note' && n ? `<p class="label">${esc(unitN(n.subjectId, n.nr))} · ${esc(n.title)}</p>` : ''}
